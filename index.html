      "'": [0x18,0x18,0x18,0x30,0,0,0,0,0,0,0,0],
      "?": [0x3C,0x7E,0xC3,0x03,0x0E,0x18,0x18,0x18,0,0x18,0x18,0],
      "!": [0x18,0x18,0x18,0x18,0x18,0x18,0x18,0x18,0,0x18,0x18,0x18],
      "+": [0,0,0x18,0x18,0x18,0xFF,0xFF,0x18,0x18,0x18,0,0],
      "*": [0,0x18,0xDB,0x7E,0x3C,0x18,0x3C,0x7E,0xDB,0x18,0,0],
      "=": [0,0,0,0xFF,0xFF,0,0,0xFF,0xFF,0,0,0],
      "%": [0x63,0x63,0x06,0x06,0x0C,0x0C,0x18,0x18,0x30,0x30,0xC6,0xC6],
      "$": [0x18,0x3C,0x7E,0xDB,0xD8,0x7C,0x3E,0x1B,0xDB,0x7E,0x3C,0x18],
      "•": [0,0,0,0x18,0x3C,0x7E,0x7E,0x3C,0x18,0,0,0],
      "(": [0x0C,0x18,0x30,0x30,0x60,0x60,0x60,0x60,0x30,0x30,0x18,0x0C],
      ")": [0x30,0x18,0x0C,0x0C,0x06,0x06,0x06,0x06,0x0C,0x0C,0x18,0x30]
    };

    function ledDpr() {
      const n = window.devicePixelRatio || 1;
      return n >= 1.5 ? Math.round(n) : Math.max(1, n);
    }

    function ledGlyph(ch) {
      const u = String(ch).toUpperCase();
      if (LED_FONT[u]) return LED_FONT[u];
      if (u === "—" || u === "–") return LED_FONT["-"];
      if (u === "·") return LED_FONT["•"];
      return LED_FONT[" "];
    }

    function ledTextLen(text) {
      return String(text || "").length;
    }

    function measureLedText(text, pitch) {
      const n = ledTextLen(text);
      return { w: Math.max(0, n * LED_ADV * pitch - pitch), h: LED_ROWS * pitch };
    }

    function measureLedRuns(runs, pitch) {
      let w = 0;
      for (const run of runs) w += measureLedText(run.t, pitch).w + pitch;
      return w;
    }

    function ledRunsCols(runs) {
      const pitch = 8;
      return Math.max(1, Math.round(measureLedRuns(runs, pitch) / pitch));
    }

    function drawLedDot(ctx, x, y, pitch, color) {
      const r = (pitch * LED_DOT) / 2;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawLedText(ctx, text, originX, originY, pitch, color) {
      let x = originX;
      const str = String(text || "");
      const S = LED_SCALE;
      for (let i = 0; i < str.length; i++) {
        const g = ledGlyph(str[i]);
        for (let row = 0; row < LED_BASE_ROWS; row++) {
          const bits = g[row] || 0;
          for (let col = 0; col < LED_BASE_COLS; col++) {
            if (bits & (0x80 >> col)) {
              for (let sr = 0; sr < S; sr++) {
                for (let sc = 0; sc < S; sc++) {
                  const c = col * S + sc;
                  const r = row * S + sr;
                  drawLedDot(ctx, x + (c + 0.5) * pitch, originY + (r + 0.5) * pitch, pitch, color);
                }
              }
            }
          }
        }
        x += LED_ADV * pitch;
      }
      return x;
    }

    function drawLedRuns(ctx, runs, originX, originY, pitch) {
      let x = originX;
      for (const run of runs) {
        const color = run.c || "#ffffff";
        drawLedText(ctx, run.t, x, originY, pitch, color);
        x += measureLedText(run.t, pitch).w + pitch;
      }
      return x;
    }

    function fitLedPitch(cssH, dpr, rows) {
      const n = rows || LED_ROWS;
      const bufH = Math.max(n, Math.round(cssH * dpr));
      return Math.max(2, Math.floor(bufH / n));
    }

    function sizeLedCanvas(cv, cssW, cssH, dpr, lockWidth) {
      const w = Math.max(1, Math.round(cssW * dpr));
      const h = Math.max(1, Math.round(cssH * dpr));
      if (cv.width !== w) cv.width = w;
      if (cv.height !== h) cv.height = h;
      if (lockWidth) cv.style.width = Math.max(1, Math.round(cssW)) + "px";
      return { w, h, dpr };
    }

    function ledCssHeight(cv, fallback) {
      const raw = getComputedStyle(cv).height;
      const v = parseFloat(raw);
      if (Number.isFinite(v) && v > 0 && v !== 150) return v;
      const ch = cv.clientHeight;
      if (ch > 0 && ch !== 150) return ch;
      return fallback;
    }

    function parseLedRuns(cv) {
      if (cv.dataset.parts) {
        try { return JSON.parse(cv.dataset.parts); } catch (e) {}
      }
      return [{ t: cv.dataset.text || "", c: cv.dataset.color || "#ffffff" }];
    }

    function parseLedLines(cv) {
      if (cv.dataset.lines) {
        try {
          const lines = JSON.parse(cv.dataset.lines);
          if (Array.isArray(lines) && lines.length) return lines;
        } catch (e) {}
      }
      return [parseLedRuns(cv)];
    }

    function paintLedTextCanvas(cv, opts) {
      opts = opts || {};
      const dpr = ledDpr();
      let lines = parseLedLines(cv);
      let nLines = Math.max(1, lines.length);
      let rowSpan = nLines * LED_ROWS + (nLines - 1);
      const fill = cv.classList.contains("led-fill") || cv.classList.contains("led-size-status");
      const parent = cv.parentElement;
      let cssW, cssH;
      if (fill) {
        cssW = cv.clientWidth || (parent && parent.clientWidth) || 300;
        cssH = cv.clientHeight || (parent && parent.clientHeight) || ledCssHeight(cv, 24);
        if (!cssW || cssW < 4) cssW = (parent && parent.clientWidth) || 300;
        if (!cssH || cssH < 4 || cssH === 150) cssH = ledCssHeight(cv, 24);
      } else {
        cssH = ledCssHeight(cv, 24);
      }
      if (lines.length > 1 && fill) {
        const maxDevW = Math.max(1, Math.round(cssW * dpr));
        const maxDevH = Math.max(1, Math.round(cssH * dpr));
        const flat = lines.reduce((acc, runs) => acc.concat(runs), []);
        const oneP = Math.max(1, Math.min(Math.floor(maxDevW / Math.max(1, ledRunsCols(flat))), Math.floor(maxDevH / LED_ROWS)));
        const twoP = Math.max(1, Math.min(Math.floor(maxDevW / Math.max(1, ...lines.map((runs) => ledRunsCols(runs)))), Math.floor(maxDevH / rowSpan)));
        const twoFits = twoP * rowSpan <= maxDevH;
        // Prefer a single sharp line when it fits, or when two lines would clip.
        if (!twoFits || (oneP >= twoP && oneP >= 2) || (oneP > twoP)) {
          lines = [flat];
          nLines = 1;
          rowSpan = LED_ROWS;
        }
      }
      let pitch = fitLedPitch(cssH, dpr, rowSpan);
      if (fill) {
        const maxDevW = Math.max(1, Math.round(cssW * dpr));
        const maxDevH = Math.max(1, Math.round(cssH * dpr));
        const maxCols = Math.max(...lines.map((runs) => ledRunsCols(runs)));
        pitch = Math.min(pitch, Math.floor(maxDevW / Math.max(1, maxCols)), Math.floor(maxDevH / Math.max(1, rowSpan)));
        pitch = Math.max(1, pitch);
      } else {
        const textWdev = Math.max(...lines.map((runs) => measureLedRuns(runs, pitch)));
        cssW = Math.max(Math.ceil(textWdev / dpr), 8);
      }
      if (opts.pitch) pitch = Math.max(2, opts.pitch);
      const { w, h } = sizeLedCanvas(cv, cssW, cssH, dpr, !fill);
      const ctx = cv.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, w, h);
      const usedH = rowSpan * pitch;
      let y = Math.floor((h - usedH) / 2);
      const align = opts.align || cv.dataset.ledAlign || (cv.classList.contains("led-size-score") ? "right" : (fill ? "center" : "left"));
      for (const runs of lines) {
        const lineW = measureLedRuns(runs, pitch);
        let x = 0;
        if (align === "right") x = Math.max(0, w - lineW);
        else if (align === "center") x = Math.max(0, Math.floor((w - lineW) / 2));
        drawLedRuns(ctx, runs, x, y, pitch);
        y += (LED_ROWS + 1) * pitch;
      }
    }

    function isLedVisible(cv) {
      if (!cv || cv.closest("[hidden]")) return false;
      const cw = cv.clientWidth, ch = cv.clientHeight;
      if (cw < 4 || ch < 4) return false;
      let el = cv;
      while (el) {
        const s = getComputedStyle(el);
        if (s.display === "none" || s.visibility === "hidden") return false;
        el = el.parentElement;
        if (el && (el.id === "board" || el === document.body)) break;
      }
      return true;
    }

    function sharedLedPitch(canvases, minChars) {
      const dpr = ledDpr();
      let maxChars = Math.max(1, minChars || 1);
      canvases.forEach((cv) => {
        const lines = parseLedLines(cv);
        lines.forEach((runs) => {
          const n = runs.reduce((sum, run) => sum + ledTextLen(run.t), 0);
          if (n > maxChars) maxChars = n;
        });
      });
      const cols = Math.max(1, maxChars * LED_ADV - 1);
      let pitch = Infinity;
      canvases.forEach((cv) => {
        const parent = cv.parentElement;
        const cssW = cv.clientWidth || (parent && parent.clientWidth) || 0;
        const cssH = cv.clientHeight || (parent && parent.clientHeight) || ledCssHeight(cv, 24);
        const p = Math.min(
          Math.floor(Math.max(1, Math.round(cssW * dpr)) / cols),
          Math.floor(Math.max(1, Math.round(cssH * dpr)) / LED_ROWS)
        );
        if (p < pitch) pitch = p;
      });
      return { pitch: Math.max(2, pitch), cols: cols, maxChars: maxChars };
    }

    function paintSharedLedGroup(canvases, minChars, defaultAlign) {
      if (!canvases.length) return;
      const { pitch } = sharedLedPitch(canvases, minChars);
      const layout = document.body.getAttribute("data-led-layout") || "";
      canvases.forEach((cv) => {
        let align = cv.dataset.ledAlign || defaultAlign;
        if (layout && layout !== "tall" && cv.classList.contains("led-size-score") && cv.closest(".spot-team.home")) {
          align = "left";
        }
        try { paintLedTextCanvas(cv, { pitch: pitch, align: align }); } catch (e) {}
      });
    }

    function setLogoBox(box, team, name) {
      if (!box) return;
      const urls = hiResLogo(team);
      const letters = teamLetters(team, name);
      let img = box.querySelector("img.led-logo-img");
      const cv = box.querySelector("canvas.led-logo-fallback");
      if (cv) cv.dataset.text = letters;
      box.hidden = false;
      if (!urls.src) {
        if (img) { img.removeAttribute("src"); img.hidden = true; }
        box.classList.add("logo-missing");
        if (cv && typeof paintLedTextCanvas === "function") paintLedTextCanvas(cv);
        return;
      }
      box.classList.remove("logo-missing");
      if (!img) {
        img = document.createElement("img");
        img.className = "led-logo-img";
        img.decoding = "async";
        box.insertBefore(img, box.firstChild);
      }
      img.hidden = false;
      img.alt = name || letters || "";
      delete img.dataset.triedFallback;
      if (urls.fallbackSrc) img.setAttribute("data-fallback-src", urls.fallbackSrc);
      else img.removeAttribute("data-fallback-src");
      if (img.src !== urls.src) img.src = urls.src;
    }

    document.addEventListener("error", (e) => {
      const img = e.target;
      if (!img || !img.classList || !img.classList.contains("led-logo-img")) return;
      const next = img.getAttribute("data-fallback-src");
      if (next && !img.dataset.triedFallback) {
        img.dataset.triedFallback = "1";
        img.src = next;
        return;
      }
      const box = img.closest(".led-logo-box");
      img.hidden = true;
      if (box) {
        box.classList.add("logo-missing");
        const cv = box.querySelector("canvas.led-logo-fallback");
        if (cv) try { paintLedTextCanvas(cv); } catch (err) {}
      }
    }, true);

    function paintLedTree(root) {
      const scope = root || document;
      const grouped = new Set();
      const spots = scope.matches && scope.matches(".spot") ? [scope] : [...scope.querySelectorAll(".spot")];
      spots.forEach((spot) => {
        const scores = [...spot.querySelectorAll("canvas.led-size-score")].filter((cv) => {
          return isLedVisible(cv) && !cv.classList.contains("spot-dash-cv") && !cv.closest(".spot-dash-slot");
        });
        paintSharedLedGroup(scores, 2, "right");
        scores.forEach((cv) => grouped.add(cv));
        const names = [...spot.querySelectorAll("canvas.led-size-label")].filter((cv) => {
          return isLedVisible(cv) && !cv.classList.contains("led-logo-fallback") && !cv.closest(".led-logo-box");
        });
        paintSharedLedGroup(names, 1, "center");
        names.forEach((cv) => grouped.add(cv));
        const ranks = [...spot.querySelectorAll("canvas.led-size-rank")].filter(isLedVisible);
        paintSharedLedGroup(ranks, 3, "left");
        ranks.forEach((cv) => grouped.add(cv));
      });
      scope.querySelectorAll("canvas.led-text-cv").forEach((cv) => {
        if (grouped.has(cv)) return;
        if (cv.classList.contains("led-logo-fallback") && !cv.closest(".logo-missing")) return;
        try { paintLedTextCanvas(cv); } catch (e) {}
      });
    }

    function scoreLedColor(competitor, isFinal, isPre) {
      if (isPre) return "#3a3a3a";
      if (isFinal && competitor.winner === true) return "#00ff44";
      if (isFinal && competitor.winner === false) return "#7a2020";
      return "#ff2a2a";
    }

    function ledCanvas(tagClass, attrs, cssClass) {
      const parts = ["canvas", "class=\"" + (cssClass || tagClass) + "\""];
      Object.keys(attrs).forEach((k) => {
        if (attrs[k] == null || attrs[k] === "") return;
        parts.push(k + "=\"" + escapeHtml(String(attrs[k])) + "\"");
      });
      return "<" + parts.join(" ") + "></canvas>";
    }

    let tickerAnim = { raf: 0, offset: 0, last: 0, runs: [], sig: "", strip: null, stripPitch: 0, stripSig: "" };

    function tickerRunsFor(event) {
      const teams = orderedCompetitors(event);
      const away = teams[0] || {};
      const home = teams[1] || teams[0] || {};
      const bucket = statusBucket(event);
      const isPre = bucket === "upcoming";
      const isFinal = bucket === "final";
      const scoreOf = (c) => {
        const raw = c.score;
        return isPre || raw === "" || raw == null ? "--" : String(raw);
      };
      const abbr = (c) => ((c.team || {}).abbreviation || (c.team || {}).shortDisplayName || "?").toUpperCase();
      let status = "";
      let sc = "#ffb000";
      if (bucket === "live") { status = "LIVE " + String(statusLabel(event) || "").toUpperCase(); sc = "#ff2a2a"; }
      else if (isFinal) { status = "FINAL"; sc = "#00ff44"; }
      else { status = String(statusLabel(event) || "UPCOMING").toUpperCase(); sc = "#3ecbff"; }
      return [
        { t: "  " + abbr(away) + " ", c: "#ffffff" },
        { t: scoreOf(away), c: scoreLedColor(away, isFinal, isPre) },
        { t: "  " + abbr(home) + " ", c: "#ffffff" },
        { t: scoreOf(home), c: scoreLedColor(home, isFinal, isPre) },
        { t: "  " + status + "   •  ", c: sc }
      ];
    }

    function drawTickerFrame(ts) {
      const cv = document.getElementById("ticker-canvas");
      if (!cv) { tickerAnim.raf = 0; return; }
      tickerAnim.raf = requestAnimationFrame(drawTickerFrame);
      const dpr = ledDpr();
      const parent = cv.parentElement;
      const cssW = (parent && parent.clientWidth) || cv.clientWidth || 300;
      const cssH = (parent && parent.clientHeight) || cv.clientHeight || 48;
      if (cv.width !== Math.round(cssW * dpr) || cv.height !== Math.round(cssH * dpr)) {
        cv.width = Math.max(1, Math.round(cssW * dpr));
        cv.height = Math.max(1, Math.round(cssH * dpr));
        cv.style.width = "100%";
        cv.style.height = cssH + "px";
      }
      const ctx = cv.getContext("2d");
      const pitch = Math.max(2, Math.floor(cv.height / LED_ROWS));
      const runs = tickerAnim.runs.length ? tickerAnim.runs : [{ t: "  NO GAMES  ", c: "#ffb000" }];
      const sig = tickerAnim.sig || "empty";
      if (!tickerAnim.strip || tickerAnim.stripPitch !== pitch || tickerAnim.stripSig !== sig) {
        const total0 = Math.max(pitch, measureLedRuns(runs, pitch));
        const strip = document.createElement("canvas");
        strip.width = Math.max(1, Math.ceil(total0));
        strip.height = Math.max(1, LED_ROWS * pitch);
        drawLedRuns(strip.getContext("2d"), runs, 0, 0, pitch);
        tickerAnim.strip = strip;
        tickerAnim.stripPitch = pitch;
        tickerAnim.stripSig = sig;
        tickerAnim.stripWidth = total0;
      }
      const total = tickerAnim.stripWidth || Math.max(pitch, measureLedRuns(runs, pitch));
      if (!tickerAnim.last) tickerAnim.last = ts;
      const dt = Math.min(50, ts - tickerAnim.last);
      tickerAnim.last = ts;
      tickerAnim.offset += pitch * LED_SCALE * tickerPps() * (dt / 1000);
      if (tickerAnim.offset > total) tickerAnim.offset = tickerAnim.offset % total;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, cv.width, cv.height);
      const y = Math.floor((cv.height - LED_ROWS * pitch) / 2);
      const start = -Math.floor(tickerAnim.offset);
      const strip = tickerAnim.strip;
      for (let x = start; x < cv.width + total; x += total) {
        ctx.drawImage(strip, x, y);
      }
    }

    function startTickerLoop() {
      if (!tickerAnim.raf) tickerAnim.raf = requestAnimationFrame(drawTickerFrame);
    }

    function teamRow(competitor, possessionId, isFinal, isPre) {
      const team = competitor.team || {};
      const rank = Number(competitor.curatedRank?.current);
      const ranked = rank >= 1 && rank <= 25;
      const name = team.shortDisplayName || team.location || team.displayName || "TBD";
      const abbrev = team.abbreviation || "";
      const record = recordOf(competitor);
      const hasBall = possessionId && String(possessionId) === String(competitor.id || team.id);
      const winner = competitor.winner === true;
      const loser = isFinal && competitor.winner === false;
      const scoreRaw = competitor.score;
      const score = isPre || scoreRaw === "" || scoreRaw == null ? "--" : String(scoreRaw);
      const classes = ["team"];
      if (hasBall) classes.push("has-ball");
      if (winner) classes.push("winner");
      if (loser) classes.push("loser");
      return (
        '<div class="' + classes.join(" ") + '">' +
          ledLogoHtml(team, name, "card-logo") +
          '<div class="ident">' +
            '<div class="name">' +
              (ranked ? '<span class="rank">' + rank + "</span>" : "") +
              escapeHtml(name) +
            "</div>" +
            '<div class="meta">' + escapeHtml([abbrev, record].filter(Boolean).join(" · ")) + "</div>" +
          "</div>" +
          footballSvg("poss") +
          '<div class="score' + (isPre ? " blank" : "") + '">' + escapeHtml(score) + "</div>" +
        "</div>"
      );
    }

    function cardHtml(event) {
      const comp = getCompetition(event);
      const bucket = statusBucket(event);
      const competitors = orderedCompetitors(event);
      const isFinal = bucket === "final";
      const isPre = bucket === "upcoming";
      const isLive = bucket === "live";
      const possessionId = isLive ? (comp.situation || {}).possession : null;
      const network = networkOf(comp);
      const label = statusLabel(event);
      const badgeText = isLive ? "Live" : isFinal ? "Final" : "Upcoming";
      const showStatus = label && label.toLowerCase() !== badgeText.toLowerCase();
      const sit = comp.situation || {};
      const footLeft = isLive
        ? (sit.downDistanceText || sit.possessionText || (sit.lastPlay && sit.lastPlay.text) || "")
        : (comp.venue && comp.venue.fullName ? comp.venue.fullName : "");
      const tags = [];
      if (isAccGame(event)) tags.push("ACC");
      if (isTop25Game(event)) tags.push("Top 25");

      return (
        '<article class="card ' + bucket + '-card">' +
          '<div class="card-top">' +
            '<div class="card-top-left">' +
              '<span class="badge ' + bucket + '">' + badgeText + "</span>" +
              (showStatus ? '<span class="status-text">' + escapeHtml(label) + "</span>" : "") +
            "</div>" +
            '<div class="card-top-right">' +
              (network ? '<span class="network">' + escapeHtml(network) + "</span>" : "") +
            "</div>" +
          "</div>" +
          competitors.map((c) => teamRow(c, possessionId, isFinal, isPre)).join("") +
          '<div class="card-foot">' +
            '<span class="play">' + escapeHtml(footLeft) + "</span>" +
            "<span>" + escapeHtml(tags.join(" · ")) + "</span>" +
          "</div>" +
        "</article>"
      );
    }

    function spotTeamHtml(competitor, possessionId, isFinal, isPre) {
      const team = competitor.team || {};
      const rank = Number(competitor.curatedRank?.current);
      const ranked = rank >= 1 && rank <= 25;
      const name = team.shortDisplayName || team.location || team.displayName || "TBD";
      const abbrev = team.abbreviation || "";
      const record = recordOf(competitor);
      const hasBall = possessionId && String(possessionId) === String(competitor.id || team.id);
      const winner = competitor.winner === true;
      const loser = isFinal && competitor.winner === false;
      const scoreRaw = competitor.score;
      const score = isPre || scoreRaw === "" || scoreRaw == null ? "--" : String(scoreRaw);
      const classes = ["spot-team", competitor.homeAway || ""];
      if (hasBall) classes.push("has-ball");
      if (winner) classes.push("winner");
      if (loser) classes.push("loser");
      const letters = (abbrev || name || "?").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 5) || (name || "?").toUpperCase().slice(0, 4);
      const scoreColor = scoreLedColor(competitor, isFinal, isPre);
      const rankCv = ranked
        ? '<div class="led-rank-slot">' +
            ledCanvas("led-text-cv", {"data-text": "#" + rank, "data-color": "#ffb000"}, "led-text-cv led-size-rank led-fill") +
          "</div>"
        : "";
      return (
        '<div class="' + classes.join(" ") + '">' +
          '<div class="spot-team-name' + (ranked ? " has-rank" : "") + '">' +
            rankCv +
            '<div class="led-name-slot">' +
              ledCanvas("led-text-cv", {"data-text": letters, "data-color": "#ffffff"}, "led-text-cv led-size-label led-fill") +
            "</div>" +
          "</div>" +
          '<div class="spot-team-score-row">' +
            ledLogoHtml(competitor.team || {}, name) +
            '<div class="led-score-slot">' +
              ledCanvas("led-text-cv", {"data-text": score, "data-color": scoreColor, "data-led-align": "right"}, "led-text-cv led-size-score led-score-inline led-fill") +
            "</div>" +
            footballSvg("poss") +
          "</div>" +
          '<div class="spot-name vh">' + escapeHtml(name) + "</div>" +
        "</div>"
      );
    }

    function spotlightHtml(event) {
      const comp = getCompetition(event);
      const bucket = statusBucket(event);
      const teams = orderedCompetitors(event);
      const away = teams[0] || {};
      const home = teams[1] || teams[0] || {};
      const isFinal = bucket === "final";
      const isPre = bucket === "upcoming";
      const isLive = bucket === "live";
      const possessionId = isLive ? (comp.situation || {}).possession : null;
      const network = networkOf(comp);
      const label = statusLabel(event);
      const badgeText = isLive ? "Live" : isFinal ? "Final" : "Upcoming";
      const showStatus = label && label.toLowerCase() !== badgeText.toLowerCase();
      const sit = comp.situation || {};
      const situation = isLive
        ? (sit.downDistanceText || sit.possessionText || (sit.lastPlay && sit.lastPlay.text) || "")
        : "";
      const venue = comp.venue && comp.venue.fullName ? comp.venue.fullName : "";
      const tags = [];
      if (isAccGame(event)) tags.push("ACC");
      if (isTop25Game(event)) tags.push("Top 25");
      const scoreOf = (c) => {
        const raw = c.score;
        return isPre || raw === "" || raw == null ? "--" : String(raw);
      };
      const awayScore = scoreOf(away);
      const homeScore = scoreOf(home);

      const midBits = situation || "";
      const line1 = [];
      const line2 = [];
      if (isLive) line1.push({ t: "LIVE  ", c: "#ff2a2a" });
      else if (isFinal) line1.push({ t: "FINAL  ", c: "#00ff44" });
      else line1.push({ t: "UPCOMING  ", c: "#3ecbff" });
      if (showStatus && label) line1.push({ t: String(label).toUpperCase() + "  ", c: "#ffffff" });
      if (midBits) line2.push({ t: String(midBits).toUpperCase() + "  ", c: "#ffb000" });
      if (network) line2.push({ t: String(network).toUpperCase() + "  ", c: "#ffffff" });
      const statusLines = line2.length ? [line1, line2] : [line1];
      const awayColor = scoreLedColor(away, isFinal, isPre);
      const homeColor = scoreLedColor(home, isFinal, isPre);
      const statusA11y = [badgeText, showStatus ? label : "", midBits, network].filter(Boolean).join(" ");
      return (
        '<article class="spot ' + bucket + '" data-id="' + escapeHtml(gameId(event)) + '">' +
          '<div class="spot-top">' +
            '<div class="led-status-slot">' +
              ledCanvas("led-text-cv", {"data-lines": JSON.stringify(statusLines)}, "led-text-cv led-size-status led-fill") +
            "</div>" +
            '<span class="vh">' + escapeHtml(statusA11y) + "</span>" +
          "</div>" +
          '<div class="spot-teams">' +
            spotTeamHtml(away, possessionId, isFinal, isPre) +
            '<div class="spot-scores" aria-hidden="true">' +
              '<div class="led-score-slot">' +
                ledCanvas("led-text-cv", {"data-text": awayScore, "data-color": awayColor, "data-led-align": "right"}, "led-text-cv led-size-score led-fill") +
              "</div>" +
              '<div class="led-score-slot spot-dash-slot">' +
                ledCanvas("led-text-cv", {"data-text": "-", "data-color": "#8a8a8a", "data-led-align": "center"}, "led-text-cv led-size-score led-fill spot-dash-cv") +
              "</div>" +
              '<div class="led-score-slot">' +
                ledCanvas("led-text-cv", {"data-text": homeScore, "data-color": homeColor, "data-led-align": "left"}, "led-text-cv led-size-score led-fill") +
              "</div>" +
            "</div>" +
            spotTeamHtml(home, possessionId, isFinal, isPre) +
          "</div>" +
        "</article>"
      );
    }

    function updateCounts() {
      const acc = state.events.filter(isAccGame).length;
      const top = state.events.filter(isTop25Game).length;
      const all = state.events.filter((e) => isAccGame(e) || isTop25Game(e)).length;
      document.getElementById("count-all").textContent = all;
      document.getElementById("count-acc").textContent = acc;
      document.getElementById("count-top25").textContent = top;
    }

    function resolveIndex(games) {
      if (!games.length) return -1;
      if (state.currentGameId) {
        const i = games.findIndex((g) => gameId(g) === String(state.currentGameId));
        if (i >= 0) return i;
      }
      return 0;
    }

    function updateRotateChrome(games, index) {
      if (!games.length) {
        rotPos.textContent = "0 of 0";
        return;
      }
      rotPos.textContent = (index + 1) + " of " + games.length;
    }

    function restartProgress() {
      progressBar.classList.remove("run");
      void progressBar.offsetWidth;
      if (state.view === "rotate" && filteredGames().length) {
        document.documentElement.style.setProperty("--dwell", state.dwellMs / 1000 + "s");
        progressBar.classList.add("run");
      }
    }

    function stopRotate() {
      if (state.rotateTimer) {
        clearTimeout(state.rotateTimer);
        state.rotateTimer = null;
      }
    }

    function scheduleRotate() {
      stopRotate();
      if (state.alertActive) return;
      if (state.view !== "rotate" || state.paused) {
        if (state.paused) return;
        progressBar.classList.remove("run");
        return;
      }
      const games = filteredGames();
      if (!games.length) {
        progressBar.classList.remove("run");
        return;
      }
      restartProgress();
      state.rotateTimer = setTimeout(() => stepRotate(1), state.dwellMs);
    }

    function paintSpotlight(event, animDir) {
      const existing = stageEl.querySelector(".spot");
      const same = existing && existing.getAttribute("data-id") === gameId(event);
      if (same && !animDir) {
        const tmp = document.createElement("div");
        tmp.innerHTML = spotlightHtml(event);
        const next = tmp.firstElementChild;
        const oldImgs = [...existing.querySelectorAll("img")];
        next.querySelectorAll("img").forEach((img) => {
          const old = oldImgs.find((o) => o.getAttribute("src") === img.getAttribute("src"));
          if (old) img.replaceWith(old);
        });
        existing.replaceWith(next);
        paintLedTreeAfterLayout(stageEl);
        return;
      }
      stageEl.classList.remove("anim-next", "anim-prev");
      if (animDir === 1) stageEl.classList.add("anim-next");
      if (animDir === -1) stageEl.classList.add("anim-prev");
      stageEl.innerHTML = spotlightHtml(event);
      paintLedTreeAfterLayout(stageEl);
      if (animDir) {
        const onEnd = () => {
          stageEl.classList.remove("anim-next", "anim-prev");
          stageEl.querySelectorAll(".spot").forEach((el) => { el.style.transform = "none"; });
          paintLedTreeAfterLayout(stageEl);
        };
        stageEl.querySelector(".spot")?.addEventListener("animationend", onEnd, { once: true });
      }
    }

    function showResolvedSpotlight(animDir) {
      const games = filteredGames();
      if (!games.length) {
        state.currentGameId = null;
        stageEl.classList.remove("anim-next", "anim-prev");
        stageEl.innerHTML =
          '<div class="msg" style="margin:auto;max-width:420px"><h2>No games in this view</h2><p>Nothing matched this filter for the selected week. Try another week or tab.</p></div>';
        updateRotateChrome(games, -1);
        progressBar.classList.remove("run");
        stopRotate();
        return;
      }
      const index = resolveIndex(games);
      state.currentGameId = gameId(games[index]);
      const currentEl = stageEl.querySelector(".spot");
      const sameGame = currentEl && currentEl.getAttribute("data-id") === state.currentGameId;
      paintSpotlight(games[index], sameGame ? 0 : animDir);
      updateRotateChrome(games, index);
    }

    function stepRotate(dir) {
      if (state.alertActive) return;
      const games = filteredGames();
      if (!games.length) return;
      let i = resolveIndex(games);
      i = (i + dir + games.length) % games.length;
      state.currentGameId = gameId(games[i]);
      paintSpotlight(games[i], dir);
      updateRotateChrome(games, i);
      if (!state.paused) scheduleRotate();
      else {
        stopRotate();
        progressBar.classList.remove("run");
      }
    }

    function renderGrid() {
      const games = filteredGames();
      if (state.error && !state.events.length) {
        gridView.innerHTML =
          '<div class="msg error"><h2>Couldn’t load scores</h2><p>' +
          escapeHtml(state.error) +
          '</p><button type="button" id="retry-btn">Try again</button></div>';
        document.getElementById("retry-btn")?.addEventListener("click", () => load(true));
        return;
      }
      if (!games.length) {
        gridView.innerHTML =
          '<div class="msg"><h2>No games in this view</h2><p>Nothing matched this filter for the selected week. Try another week or tab.</p></div>';
        return;
      }
      const groups = { live: [], final: [], upcoming: [] };
      for (const ev of games) groups[statusBucket(ev)].push(ev);
      const titles = { live: "Live", final: "Final", upcoming: "Upcoming" };
      let html = "";
      for (const key of ["live", "final", "upcoming"]) {
        const list = groups[key];
        if (!list.length) continue;
        html +=
          '<section class="status-section">' +
          '<h2 class="status-head ' + key + '"><span class="dot"></span>' +
          titles[key] + " (" + list.length + ")</h2>" +
          '<div class="grid">' + list.map(cardHtml).join("") + "</div></section>";
      }
      gridView.innerHTML = html;
      paintLedTreeAfterLayout(gridView);
    }

    function applyViewMode() {
      const isRotate = state.view === "rotate";
      document.body.classList.toggle("view-rotate", isRotate);
      document.body.classList.toggle("view-grid", !isRotate);
      document.body.classList.toggle("is-paused", state.paused);
      rotateView.hidden = !isRotate;
      gridView.hidden = isRotate;
      document.getElementById("view-rotate").setAttribute("aria-pressed", isRotate ? "true" : "false");
      document.getElementById("view-grid").setAttribute("aria-pressed", isRotate ? "false" : "true");
    }

    function setView(view) {
      state.view = view;
      savePrefs();
      applyViewMode();
      if (view === "rotate") {
        showResolvedSpotlight(0);
        if (!state.paused) scheduleRotate();
      } else {
        stopRotate();
        progressBar.classList.remove("run");
        renderGrid();
      }
    }

    function setPaused(paused) {
      state.paused = paused;
      document.body.classList.toggle("is-paused", paused);
      rotPlay.setAttribute("aria-label", paused ? "Play rotation" : "Pause rotation");
      rotPlay.setAttribute("aria-pressed", paused ? "true" : "false");
      iconPause.hidden = paused;
      iconPlay.hidden = !paused;
      if (state.alertActive) return;
      if (paused) stopRotate();
      else scheduleRotate();
    }

    function updateTimestamp() {
      if (!state.lastUpdated) {
        updatedEl.textContent = "";
        return;
      }
      updatedEl.innerHTML =
        "Updated " + formatNow(state.lastUpdated) +
        ' <span class="hint">· Auto-refresh 10s</span>';
    }

    function scheduleRefresh() {
      if (state.refreshTimer) clearInterval(state.refreshTimer);
      state.refreshTimer = setInterval(() => load(false), REFRESH_MS);
    }


    function updateTicker() {
      const games = (typeof filteredGames === "function") ? filteredGames() : [];
      const runs = [];
      if (!games.length) runs.push({ t: "  NO GAMES  ", c: "#ffb000" });
      else games.forEach((g) => { runs.push.apply(runs, tickerRunsFor(g)); });
      const sig = JSON.stringify(runs);
      if (sig !== tickerAnim.sig) {
        tickerAnim.runs = runs;
        tickerAnim.sig = sig;
        tickerAnim.strip = null;
      }
      startTickerLoop();
    }

    let controlsTimer = null;
    function hideControls() {
      document.body.classList.remove("controls-on");
      if (controlsTimer) {
        clearTimeout(controlsTimer);
        controlsTimer = null;
      }
    }
    function showControls(ms) {
      document.body.classList.add("controls-on");
      if (controlsTimer) clearTimeout(controlsTimer);
      controlsTimer = setTimeout(() => {
        document.body.classList.remove("controls-on");
        controlsTimer = null;
      }, ms == null ? 4000 : ms);
    }
    function toggleControls() {
      if (document.body.classList.contains("controls-on")) hideControls();
      else showControls(10000);
    }

    function render() {
      updateCounts();
      updateTicker();
      if (state.error && !state.events.length) {
        stopRotate();
        const errHtml =
          '<div class="msg error"><h2>Couldn’t load scores</h2><p>' +
          escapeHtml(state.error) +
          '</p><button type="button" class="retry-btn">Try again</button></div>';
        if (state.view === "rotate") {
          stageEl.innerHTML = errHtml;
          stageEl.querySelector(".retry-btn")?.addEventListener("click", () => load(true));
        } else {
          gridView.innerHTML = errHtml;
          gridView.querySelector(".retry-btn")?.addEventListener("click", () => load(true));
        }
        return;
      }
      if (state.alertActive) {
        const ev = state.events.find((e) => gameId(e) === String(state.currentGameId));
        if (ev && state.view === "rotate") paintSpotlight(ev, 0);
        if (state.view === "grid") renderGrid();
        return;
      }
      if (state.view === "rotate") {
        const before = state.currentGameId;
        showResolvedSpotlight(0);
        if (!state.paused) {
          // Keep the dwell timer running across data refreshes so we don't
          // restart the 8s clock (and skip back) every 10s poll.
          if (!state.rotateTimer) scheduleRotate();
        }
        if (before && before !== state.currentGameId) {
          // Held game disappeared; start a fresh dwell on the fallback game.
          if (!state.paused) scheduleRotate();
        }
      } else {
        renderGrid();
      }
    }

    async function load(showSkeleton) {
      if (state.loading) return;
      state.loading = true;
      state.error = null;
      refreshBtn.disabled = true;
      refreshIcon.classList.add("spin");
      if (showSkeleton) {
        boardEl.setAttribute("aria-busy", "true");
        if (state.view === "rotate") {
          stageEl.innerHTML = '<div class="skel-spot" aria-hidden="true"></div>';
        } else {
          gridView.innerHTML =
            '<div class="skel" aria-hidden="true"><div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div></div>';
        }
      }
      try {
        const data = await fetchScoreboard();
        const incoming = data.events || [];
        const alerts = state.alertsOn
          ? detectScoreAlerts(state.scoreSnap, incoming, state.filter)
          : [];
        state.events = incoming;
        state.scoreSnap = snapshotScores(incoming);
        const wasSkip = state.skipAlerts;
        state.skipAlerts = false;
        populateCalendar(data);
        state.lastUpdated = new Date();
        boardEl.setAttribute("aria-busy", "false");
        if (!wasSkip && alerts.length) enqueueAlerts(alerts);
        render();
        updateTimestamp();
        scheduleRefresh();
      } catch (err) {
        state.error = err.message || "Network error";
        boardEl.setAttribute("aria-busy", "false");
        render();
        updatedEl.textContent = "Update failed";
      } finally {
        state.loading = false;
        refreshBtn.disabled = false;
        refreshIcon.classList.remove("spin");
      }
    }

    document.querySelectorAll(".tabs button").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.filter = btn.dataset.filter;
        document.querySelectorAll(".tabs button").forEach((b) =>
          b.setAttribute("aria-selected", b === btn ? "true" : "false")
        );
        const games = filteredGames();
        if (!games.some((g) => gameId(g) === String(state.currentGameId))) {
          state.currentGameId = games[0] ? gameId(games[0]) : null;
        }
        state.alertQueue = state.alertQueue.filter((it) =>
          games.some((g) => gameId(g) === String(it.gameId))
        );
        if (state.alertActive) {
          const ev = state.events.find((e) => gameId(e) === String(state.currentGameId));
          if (!ev || !matchesFilter(ev, state.filter)) clearAlerts();
        }
        if (state.alertActive) {
          updateCounts();
          return;
        }
        if (state.view === "rotate") {
          showResolvedSpotlight(0);
          if (!state.paused) scheduleRotate();
        } else {
          renderGrid();
        }
        updateCounts();
      });
    });

    document.getElementById("view-rotate").addEventListener("click", () => setView("rotate"));
    document.getElementById("view-grid").addEventListener("click", () => setView("grid"));
    document.getElementById("rot-prev").addEventListener("click", () => stepRotate(-1));
    document.getElementById("rot-next").addEventListener("click", () => stepRotate(1));
    rotPlay.addEventListener("click", () => setPaused(!state.paused));

    dwellRange.value = String(state.dwellMs / 1000);
    dwellLabel.textContent = state.dwellMs / 1000 + "s";
    document.documentElement.style.setProperty("--dwell", state.dwellMs / 1000 + "s");
    dwellRange.addEventListener("input", () => {
      state.dwellMs = clampDwell(Number(dwellRange.value) * 1000);
      dwellLabel.textContent = state.dwellMs / 1000 + "s";
      savePrefs();
      document.documentElement.style.setProperty("--dwell", state.dwellMs / 1000 + "s");
      if (state.view === "rotate" && !state.paused) scheduleRotate();
    });

    function syncTickerControl() {
      const x = clampTickerX(state.tickerX);
      state.tickerX = x;
      tickerRange.value = String(x);
      tickerLabel.textContent = (Number.isInteger(x) ? String(x) : x.toFixed(1)) + "x";
    }
    syncTickerControl();
    tickerRange.addEventListener("input", () => {
      state.tickerX = clampTickerX(tickerRange.value);
      syncTickerControl();
      savePrefs();
    });

    document.getElementById("fs-btn").addEventListener("click", () => {
      if (document.fullscreenElement) document.exitFullscreen?.();
      else document.documentElement.requestFullscreen?.();
    });

    document.addEventListener("keydown", (e) => {
      const tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
      if (e.key === "t" || e.key === "T") {
        e.preventDefault();
        window.__cfbDemo.simulateBoth();
        return;
      }
      if (e.key === "g" || e.key === "G") {
        e.preventDefault();
        window.__cfbDemo.simulateFg();
        return;
      }
      if (e.key === "f" || e.key === "F") { e.preventDefault(); document.getElementById("fs-btn").click(); return; }
      if (state.view !== "rotate" || state.alertActive) {
        if ((e.key === " " || e.key === "Spacebar") && !state.alertActive) {
          e.preventDefault();
          setPaused(!state.paused);
        }
        return;
      }
      if (e.key === "ArrowRight") { e.preventDefault(); stepRotate(1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); stepRotate(-1); }
      else if (e.key === " " || e.key === "Spacebar") { e.preventDefault(); setPaused(!state.paused); }
    });

    weekEl.addEventListener("change", () => {
      const [seasonType, week] = weekEl.value.split(":");
      state.seasonType = seasonType;
      state.week = week;
      state.currentGameId = null;
      clearAlerts();
      state.skipAlerts = true;
      state.scoreSnap = null;
      load(true);
    });

    refreshBtn.addEventListener("click", () => load(false));

    applyAlertToggles();
    alertsBtn.addEventListener("click", () => {
      state.alertsOn = !state.alertsOn;
      savePrefs();
      applyAlertToggles();
      if (!state.alertsOn) clearAlerts();
    });
    soundBtn.addEventListener("click", () => {
      state.soundOn = !state.soundOn;
      savePrefs();
      applyAlertToggles();
      if (state.soundOn) getAudioCtx();
    });

    const finePointer = window.matchMedia("(hover: hover) and (pointer: fine)");
    document.addEventListener("mousemove", () => {
      if (finePointer.matches) showControls();
    });
    document.addEventListener("keydown", () => showControls());
    showControls(5000);

    function paintLedTreeAfterLayout(root) {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          paintLedTree(root);
        });
      });
    }

    let ledResizeTimer = null;
    function scheduleLedRepaint() {
      if (ledResizeTimer) clearTimeout(ledResizeTimer);
      ledResizeTimer = setTimeout(() => {
        applyLedLayout();
        paintLedTreeAfterLayout(document);
        startTickerLoop();
      }, 80);
    }
    applyLedLayout();
    window.addEventListener("resize", scheduleLedRepaint);
    window.visualViewport?.addEventListener("resize", scheduleLedRepaint);
    window.addEventListener("orientationchange", () => {
      applyLedLayout();
      scheduleLedRepaint();
      setTimeout(scheduleLedRepaint, 250);
    });
    document.addEventListener("fullscreenchange", scheduleLedRepaint);
    document.addEventListener("webkitfullscreenchange", scheduleLedRepaint);
    let ledDprMq = null;
    const watchLedDpr = () => {
      if (ledDprMq) ledDprMq.removeEventListener("change", onLedDprChange);
      ledDprMq = window.matchMedia("(resolution: " + window.devicePixelRatio + "dppx)");
      ledDprMq.addEventListener("change", onLedDprChange);
    };
    function onLedDprChange() {
      scheduleLedRepaint();
      watchLedDpr();
    }
    watchLedDpr();


    let swipeX = null, swipeY = null, swipeT = 0, swipeMoved = false, swipePointer = null;
    const swipeIgnore = "a, button, input, select, textarea, label, .topbar, .rotate-bar, .rot-progress";
    function pointerOnChrome(target) {
      return !!(target && target.closest && target.closest(swipeIgnore));
    }
    document.addEventListener("pointerdown", (e) => {
      if (e.button != null && e.button !== 0) return;
      swipeX = e.clientX;
      swipeY = e.clientY;
      swipeT = Date.now();
      swipeMoved = false;
      swipePointer = e.pointerId;
    }, { passive: true });
    document.addEventListener("pointermove", (e) => {
      if (swipeX == null) return;
      if (Math.abs(e.clientX - swipeX) > 12 || Math.abs(e.clientY - swipeY) > 12) swipeMoved = true;
    }, { passive: true });
    document.addEventListener("pointerup", (e) => {
      if (swipeX == null) return;
      if (swipePointer != null && e.pointerId !== swipePointer) return;
      const dx = e.clientX - swipeX;
      const dy = e.clientY - swipeY;
      const dt = Date.now() - swipeT;
      const onChrome = pointerOnChrome(e.target);
      swipeX = null;
      swipeY = null;
      swipePointer = null;
      if (state.alertActive) return;
      if (Math.abs(dx) >= 50 && Math.abs(dx) > Math.abs(dy) * 1.25 && state.view === "rotate") {
        stepRotate(dx < 0 ? 1 : -1);
        return;
      }
      if (!swipeMoved && !onChrome && dt < 600) toggleControls();
    }, { passive: true });
    document.addEventListener("pointercancel", () => {
      swipeX = null;
      swipeY = null;
      swipePointer = null;
    }, { passive: true });

    applyViewMode();
    setPaused(false);
    load(true).then(() => {
      if (demoMode) window.setTimeout(() => window.__cfbDemo.simulateBoth(), 800);
    });
  </script>
</body>
</html>
