    const WX_CACHE_KEY = "cfb-scoreboard-wx";
    const WX_TTL_MS = 30 * 60 * 1000;
    const WX_GEO_TTL_MS = 7 * 24 * 60 * 60 * 1000;
    const US_STATES = {
      AL:"Alabama", AK:"Alaska", AZ:"Arizona", AR:"Arkansas", CA:"California", CO:"Colorado",
      CT:"Connecticut", DE:"Delaware", FL:"Florida", GA:"Georgia", HI:"Hawaii", ID:"Idaho",
      IL:"Illinois", IN:"Indiana", IA:"Iowa", KS:"Kansas", KY:"Kentucky", LA:"Louisiana",
      ME:"Maine", MD:"Maryland", MA:"Massachusetts", MI:"Michigan", MN:"Minnesota",
      MS:"Mississippi", MO:"Missouri", MT:"Montana", NE:"Nebraska", NV:"Nevada",
      NH:"New Hampshire", NJ:"New Jersey", NM:"New Mexico", NY:"New York", NC:"North Carolina",
      ND:"North Dakota", OH:"Ohio", OK:"Oklahoma", OR:"Oregon", PA:"Pennsylvania",
      RI:"Rhode Island", SC:"South Carolina", SD:"South Dakota", TN:"Tennessee", TX:"Texas",
      UT:"Utah", VT:"Vermont", VA:"Virginia", WA:"Washington", WV:"West Virginia",
      WI:"Wisconsin", WY:"Wyoming", DC:"District of Columbia"
    };
    const STATE_ABBR = Object.fromEntries(Object.entries(US_STATES).flatMap(([ab, name]) => [[name.toLowerCase(), ab], [ab.toLowerCase(), ab]]));

    // AccuWeather icon numbers used by ESPN conditionId, plus name fallbacks.
    function wxKindFromEspn(conditionId, displayValue) {
      const rawId = String(conditionId == null ? "" : conditionId).trim();
      const rawName = String(displayValue == null ? "" : displayValue).trim();
      const idNum = /^\d+$/.test(rawId) ? Number(rawId) : (/^\d+$/.test(rawName) ? Number(rawName) : NaN);
      const name = (Number.isFinite(idNum) ? rawName : rawId || rawName).toLowerCase();
      if (Number.isFinite(idNum)) {
        if (idNum === 32) return "wind";
        if (idNum === 11) return "fog";
        if ([15, 16, 17, 41, 42].includes(idNum)) return "thunderstorm";
        if ([19, 20, 21, 22, 23, 24, 25, 26, 29, 43, 44].includes(idNum)) return "snow";
        if ([12, 13, 14, 18, 39, 40].includes(idNum)) return "rain";
        if ([7, 8, 38].includes(idNum)) return "cloudy";
        if ([35, 36, 37].includes(idNum)) return "partly-cloudy-night";
        if ([3, 4, 5, 6].includes(idNum)) return "partly-cloudy";
        if ([33, 34].includes(idNum)) return "moon";
        if ([1, 2, 30, 31].includes(idNum)) return "sun";
      }
      if (/thunder|t-?storm|lightning/.test(name)) return "thunderstorm";
      if (/snow|flurries|sleet|blizzard|ice|freezing/.test(name)) return "snow";
      if (/rain|shower|drizzle/.test(name)) return "rain";
      if (/fog|mist|haze|hazy/.test(name)) return "fog";
      if (/wind/.test(name)) return "wind";
      if (/overcast|cloudy|cloud/.test(name) && /partly|mostly sunny|intermittent|broken/.test(name)) return "partly-cloudy";
      if (/overcast|cloud/.test(name) && !/partly|sunny|clear/.test(name)) return "cloudy";
      if (/partly|intermittent|mostly cloudy/.test(name)) return "partly-cloudy";
      if (/sun|clear|fair|hot|cold/.test(name)) return "sun";
      return "partly-cloudy";
    }

    function isNightAt(date) {
      const d = date instanceof Date ? date : new Date(date);
      if (!Number.isFinite(d.getTime())) return false;
      const hour = Number(new Intl.DateTimeFormat("en-US", {
        timeZone: "America/New_York", hour: "numeric", hour12: false
      }).format(d));
      return hour < 6 || hour >= 19;
    }
    function withNightKind(kind, night) {
      if (!night) return kind;
      if (kind === "sun") return "moon";
      if (kind === "partly-cloudy") return "partly-cloudy-night";
      return kind;
    }
    function wxKindFromWmo(code, windMph, night) {
      const c = Number(code);
      let kind = "sun";
      if (c >= 95) kind = "thunderstorm";
      else if ([71, 73, 75, 77, 85, 86].includes(c)) kind = "snow";
      else if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(c)) kind = "rain";
      else if ([45, 48].includes(c)) kind = "fog";
      else if (c === 3 || c === 8) kind = "cloudy";
      else if (c === 2 || c === 1) kind = "partly-cloudy";
      else if ((c === 0 || c === 1) && Number(windMph) >= 25) kind = "wind";
      else if (Number(windMph) >= 32) kind = "wind";
      return withNightKind(kind, night);
    }

    function venueInfo(event) {
      const comp = getCompetition(event) || {};
      const venue = comp.venue || event.venue || {};
      const addr = venue.address || {};
      const city = String(addr.city || "").trim();
      let state = String(addr.state || "").trim();
      if (state && STATE_ABBR[state.toLowerCase()]) state = STATE_ABBR[state.toLowerCase()];
      else if (state.length > 2) {
        const hit = Object.keys(US_STATES).find((ab) => US_STATES[ab].toLowerCase() === state.toLowerCase());
        if (hit) state = hit;
      }
      return {
        name: String(venue.fullName || venue.displayName || "").trim(),
        city: city,
        state: state,
        indoor: !!venue.indoor,
      };
    }

    function shortenVenueName(name) {
      let n = String(name || "").trim();
      const at = n.toLowerCase().lastIndexOf(" at ");
      if (at >= 0 && n.length - (at + 4) >= 8) n = n.slice(at + 4).trim();
      n = n.replace(/^(Gate City Bank Field at (the )?)/i, "");
      return n;
    }

    function venueLabel(info, maxChars) {
      if (!info) return "";
      const loc = [info.city, info.state].filter(Boolean).join(", ");
      const strip = (n) => String(n || "").replace(/\s+(Stadium|Field|Arena|Coliseum|Dome|Center|Park|Pavilion|Gym)$/i, "").trim();
      const names = [info.name, shortenVenueName(info.name), strip(info.name), strip(shortenVenueName(info.name))].filter(Boolean);
      const uniq = [];
      names.forEach((n) => { if (n && !uniq.includes(n)) uniq.push(n); });
      const candidates = [];
      uniq.forEach((n) => { if (loc) candidates.push(n + ", " + loc); });
      uniq.forEach((n) => candidates.push(n));
      if (loc) candidates.push(loc);
      const limit = Math.max(8, maxChars || 80);
      const fit = candidates.find((s) => s.length <= limit);
      if (fit) return fit;
      // Prefer a complete city/state (the painter can scale it) over a mid-word cut.
      return loc || uniq[uniq.length - 1] || candidates[0] || "";
    }

    function fitVenueSlot(row) {
      const cv = row.querySelector(".led-venue-slot canvas");
      if (!cv) return;
      const cssH = row.clientHeight || 28;
      const cssW = (cv.parentElement && cv.parentElement.clientWidth) || cv.clientWidth || 200;
      const dpr = ledDpr();
      const pitch = Math.max(2, fitLedPitch(cssH, dpr, LED_ROWS));
      const maxChars = Math.max(8, Math.floor((cssW * dpr) / (LED_ADV * pitch)));
      const raw = String(cv.dataset.text || "");
      const next = venueLabel({
        name: row.dataset.venueName || row.dataset.venueFull || raw,
        city: row.dataset.venueCity || "",
        state: row.dataset.venueState || "",
      }, maxChars);
      if (next && next.toUpperCase() !== raw) {
        cv.dataset.text = next.toUpperCase();
      }
    }

    function espnWeather(event) {
      const comp = getCompetition(event) || {};
      const wx = comp.weather || event.weather;
      if (!wx || typeof wx !== "object") return null;
      const temp = Number(wx.temperature);
      if (!Number.isFinite(temp) && !wx.displayValue && wx.conditionId == null) return null;
      return {
        temp: Number.isFinite(temp) ? Math.round(temp) : null,
        kind: wxKindFromEspn(wx.conditionId, wx.displayValue),
        display: wx.displayValue || "",
      };
    }

    let wxCacheMem = null;
    function loadWxCache() {
      if (wxCacheMem) return wxCacheMem;
      try { wxCacheMem = JSON.parse(localStorage.getItem(WX_CACHE_KEY) || "{}") || {}; }
      catch { wxCacheMem = {}; }
      if (!wxCacheMem.geo) wxCacheMem.geo = {};
      if (!wxCacheMem.wx) wxCacheMem.wx = {};
      return wxCacheMem;
    }
    function saveWxCache() {
      try { localStorage.setItem(WX_CACHE_KEY, JSON.stringify(wxCacheMem || loadWxCache())); } catch {}
    }
    function pruneWxCache() {
      const c = loadWxCache();
      const now = Date.now();
      Object.keys(c.geo).forEach((k) => { if (now - (c.geo[k].at || 0) > WX_GEO_TTL_MS) delete c.geo[k]; });
      Object.keys(c.wx).forEach((k) => { if (now - (c.wx[k].at || 0) > WX_TTL_MS * 2) delete c.wx[k]; });
    }

    function eventKickoffDate(event) {
      const comp = getCompetition(event) || {};
      const iso = event.date || comp.date || "";
      const d = new Date(iso);
      return Number.isFinite(d.getTime()) ? d : new Date();
    }

    function wxHourKey(lat, lon, when) {
      const d = new Date(when);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      const h = String(d.getHours()).padStart(2, "0");
      return Number(lat).toFixed(3) + "," + Number(lon).toFixed(3) + "|" + y + "-" + m + "-" + day + "T" + h;
    }

    const wxInflight = new Map();

    async function geocodeVenue(info) {
      const key = (info.city + "|" + info.state + "|" + info.name).toLowerCase();
      const c = loadWxCache();
      const hit = c.geo[key];
      if (hit && Date.now() - hit.at < WX_GEO_TTL_MS && hit.lat != null) return hit;
      const q = info.city || shortenVenueName(info.name) || info.name;
      if (!q) return null;
      const url = "https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(q) +
        "&count=8&language=en&format=json";
      const res = await fetch(url);
      if (!res.ok) throw new Error("geocode " + res.status);
      const data = await res.json();
      const results = data.results || [];
      const stateName = US_STATES[info.state] || info.state;
      const prefer = results.find((r) => {
        const admin = String(r.admin1 || "");
        const cc = String(r.country_code || "");
        if (info.state && (admin === info.state || admin === stateName || admin.toLowerCase() === String(stateName).toLowerCase())) return true;
        return false;
      }) || results.find((r) => !info.state || String(r.country_code || "") === "US") || results[0];
      if (!prefer) return null;
      const loc = { lat: prefer.latitude, lon: prefer.longitude, at: Date.now() };
      c.geo[key] = loc;
      saveWxCache();
      return loc;
    }

    async function fetchMeteoWeather(event, info) {
      const loc = await geocodeVenue(info);
      if (!loc) return null;
      const bucket = statusBucket(event);
      const when = (bucket === "live") ? new Date() : eventKickoffDate(event);
      const key = wxHourKey(loc.lat, loc.lon, when);
      const c = loadWxCache();
      const hit = c.wx[key];
      if (hit && Date.now() - hit.at < WX_TTL_MS) return hit;
      const url = "https://api.open-meteo.com/v1/forecast?latitude=" + loc.lat + "&longitude=" + loc.lon +
        "&hourly=temperature_2m,weather_code,wind_speed_10m&current=temperature_2m,weather_code,wind_speed_10m" +
        "&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America/New_York&forecast_days=8&past_days=1";
      const res = await fetch(url);
      if (!res.ok) throw new Error("meteo " + res.status);
      const data = await res.json();
      let temp, code, wind;
      if (bucket === "live" && data.current) {
        temp = data.current.temperature_2m;
        code = data.current.weather_code;
        wind = data.current.wind_speed_10m;
      } else {
        const hours = (data.hourly && data.hourly.time) || [];
        const target = when.getTime();
        let best = 0, bestD = Infinity;
        for (let i = 0; i < hours.length; i++) {
          const d = Math.abs(new Date(hours[i]).getTime() - target);
          if (d < bestD) { bestD = d; best = i; }
        }
        temp = data.hourly.temperature_2m && data.hourly.temperature_2m[best];
        code = data.hourly.weather_code && data.hourly.weather_code[best];
        wind = data.hourly.wind_speed_10m && data.hourly.wind_speed_10m[best];
      }
      const out = {
        temp: Number.isFinite(Number(temp)) ? Math.round(Number(temp)) : null,
        kind: wxKindFromWmo(code, wind, isNightAt(when)),
        at: Date.now(),
      };
      c.wx[key] = out;
      pruneWxCache();
      saveWxCache();
      return out;
    }

    function cachedMeteo(event, info) {
      const c = loadWxCache();
      const key = (info.city + "|" + info.state + "|" + info.name).toLowerCase();
      const geo = c.geo[key];
      if (!geo || geo.lat == null) return null;
      const bucket = statusBucket(event);
      const when = (bucket === "live") ? new Date() : eventKickoffDate(event);
      const hit = c.wx[wxHourKey(geo.lat, geo.lon, when)];
      if (hit && Date.now() - (hit.at || 0) < WX_TTL_MS) return hit;
      return null;
    }

    function weatherForEvent(event) {
      const info = venueInfo(event);
      const label = venueLabel(info, 80);
      if (!info.name && !info.city) return { label: "", kind: null, temp: null, indoor: false };
      if (info.indoor) return { label: label, kind: "dome", temp: null, indoor: true };
      const espn = espnWeather(event);
      if (espn) return { label: label, kind: espn.kind, temp: espn.temp, indoor: false, source: "espn" };
      const cached = cachedMeteo(event, info);
      if (cached) return { label: label, kind: cached.kind, temp: cached.temp, indoor: false, source: "meteo" };
      return { label: label, kind: null, temp: null, indoor: false, pending: true, info: info };
    }

    function requestVenueWeather(event) {
      const id = gameId(event);
      const info = venueInfo(event);
      if (!info || info.indoor || espnWeather(event)) return;
      if (wxInflight.has(id)) return;
      const p = fetchMeteoWeather(event, info).then((wx) => {
        wxInflight.delete(id);
        if (!wx) return;
        const root = stageEl && stageEl.querySelector('.spot[data-id="' + id + '"]');
        if (root) applyVenueWeather(root, { label: venueLabel(info, 80), kind: wx.kind, temp: wx.temp, indoor: false });
      }).catch(() => { wxInflight.delete(id); });
      wxInflight.set(id, p);
    }

    function applyVenueWeather(root, wx) {
      if (!root) return;
      const iconWrap = root.querySelector(".led-wx-icon");
      const tempSlot = root.querySelector(".led-wx-temp");
      const tempCv = tempSlot && tempSlot.querySelector("canvas");
      const venueCv = root.querySelector(".led-venue-slot canvas");
      if (venueCv && wx.label) {
        venueCv.dataset.text = String(wx.label).toUpperCase();
        delete venueCv.dataset.lines;
      }
      if (wx.kind && iconWrap) {
        iconWrap.hidden = false;
        setWxIcon(iconWrap, wx.kind);
      } else if (iconWrap) {
        iconWrap.hidden = true;
      }
      if (wx.temp != null && Number.isFinite(Number(wx.temp)) && tempCv) {
        tempCv.dataset.text = String(Math.round(Number(wx.temp))) + "°";
        if (tempSlot) tempSlot.hidden = false;
      } else if (tempSlot) {
        tempSlot.hidden = true;
      }
      if (root.isConnected) paintLedTreeAfterLayout(root.querySelector(".spot-venue") || root);
    }

    function wxIconSvg(kind) {
      return WX_SVG[kind] || WX_SVG["partly-cloudy"];
    }

    function setWxIcon(el, kind) {
      if (!el) return;
      const next = kind || "";
      if (el.dataset.wxKind === next && el.querySelector("svg")) return;
      el.dataset.wxKind = next;
      el.innerHTML = next ? wxIconSvg(next) : "";
    }

    function venueRowHtml(event) {
      const wx = weatherForEvent(event);
      if (!wx.label && !wx.kind && wx.temp == null) return "";
      if (wx.pending) requestVenueWeather(event);
      const tempText = (wx.temp != null && Number.isFinite(Number(wx.temp))) ? (Math.round(Number(wx.temp)) + "°") : "";
      const a11y = [wx.label, wx.indoor ? "Indoor" : "", tempText].filter(Boolean).join(", ");
      const iconHidden = wx.kind ? "" : " hidden";
      const tempHidden = tempText ? "" : " hidden";
      const info = venueInfo(event);
      return '<div class="spot-venue" data-venue-name="' + escapeHtml(info.name || "") +
        '" data-venue-city="' + escapeHtml(info.city || "") +

          ledCanvas("led-text-cv", { "data-text": String(wx.label || "").toUpperCase(), "data-color": "#d0d8e8", "data-led-align": "left" }, "led-text-cv led-fill") +
        "</div>" +

          (wx.kind ? wxIconSvg(wx.kind) : "") +

        "</div>" +

    function spotlightHtml(event) {
      const comp = getCompetition(event);
      const bucket = statusBucket(event);
      const teams = orderedCompetitors(event);
      const away = teams[0] || {};
      const home = teams[1] || teams[0] || {};
      const isFinal = bucket === "final";
      const isPre = bucket === "upcoming";
      const isLive = bucket === "live";
      const possessionId = isLive ? (comp.situation || {}).possession : null;
      const network = networkOf(comp);
      const label = statusLabel(event);
      const badgeText = isLive ? "Live" : isFinal ? "Final" : "Upcoming";
      const showStatus = label && label.toLowerCase() !== badgeText.toLowerCase();
      const sit = comp.situation || {};
      const situation = isLive
        ? (sportOf(event) === "mlb"
          ? baseballSituation(event)
          : (sit.downDistanceText || sit.possessionText || (sit.lastPlay && sit.lastPlay.text) || ""))
        : "";
      const venue = comp.venue && comp.venue.fullName ? comp.venue.fullName : "";
      const tags = [];
      if (isAccGame(event)) tags.push("ACC");
      if (isTop25Game(event)) tags.push("Top 25");
      const scoreOf = (c) => {
        const raw = c.score;
        return isPre || raw === "" || raw == null ? "--" : String(raw);
      };
      const awayScore = scoreOf(away);
      const homeScore = scoreOf(home);

      const midBits = situation || "";
      const line1 = [];
      const line2 = [];
      const sportTag = sportMeta(event).tag;
      line1.push({ t: sportTag + "  ", c: "#3ecbff" });
      if (isLive) line1.push({ t: "LIVE  ", c: "#ff2a2a" });
      else if (isFinal) line1.push({ t: "FINAL  ", c: "#00ff44" });
      else line1.push({ t: "UPCOMING  ", c: "#3ecbff" });
      if (showStatus && label) line1.push({ t: String(label).toUpperCase() + "  ", c: "#ffffff" });
      if (midBits) line2.push({ t: String(midBits).toUpperCase() + "  ", c: "#ffb000" });
      if (network) line2.push({ t: String(network).toUpperCase() + "  ", c: "#ffffff" });
      const statusLines = line2.length ? [line1, line2] : [line1];
      const awayColor = scoreLedColor(away, isFinal, isPre);
      const homeColor = scoreLedColor(home, isFinal, isPre);
      const statusA11y = [badgeText, showStatus ? label : "", midBits, network].filter(Boolean).join(" ");
      return (
        '<article class="spot ' + bucket + '" data-id="' + escapeHtml(gameId(event)) + '">' +
          '<div class="spot-top">' +
            '<div class="led-status-slot">' +
              ledCanvas("led-text-cv", {"data-lines": JSON.stringify(statusLines)}, "led-text-cv led-size-status led-fill") +
            "</div>" +
            '<span class="vh">' + escapeHtml(statusA11y) + "</span>" +
            venueRowHtml(event) +
          "</div>" +
          '<div class="spot-teams">' +
            spotTeamHtml(away, possessionId, isFinal, isPre) +
            '<div class="spot-scores" aria-hidden="true">' +
              '<div class="led-score-slot">' +
                ledCanvas("led-text-cv", {"data-text": awayScore, "data-color": awayColor, "data-led-align": "right"}, "led-text-cv led-size-score led-fill") +
              "</div>" +
              '<div class="led-score-slot spot-dash-slot">' +
                ledCanvas("led-text-cv", {"data-text": "-", "data-color": "#8a8a8a", "data-led-align": "center"}, "led-text-cv led-size-score led-fill spot-dash-cv") +
              "</div>" +
              '<div class="led-score-slot">' +
                ledCanvas("led-text-cv", {"data-text": homeScore, "data-color": homeColor, "data-led-align": "left"}, "led-text-cv led-size-score led-fill") +
              "</div>" +
            "</div>" +
            spotTeamHtml(home, possessionId, isFinal, isPre) +
          "</div>" +
        "</article>"
      );
    }

    function messageSlideEnabled() {
      return !!(state.message && state.message.enabled && String(state.message.text || "").trim());
    }
    function messageSlideItem() {
      return { _kind: "message", id: MESSAGE_SLIDE_ID };
    }
    function isMessageSlide(item) {
      return !!(item && (item._kind === "message" || item === MESSAGE_SLIDE_ID || item.id === MESSAGE_SLIDE_ID));
    }
    function rotateItemId(item) {
      if (isMessageSlide(item)) return MESSAGE_SLIDE_ID;
      return gameId(item);
    }
    function rotateItems() {
      const games = filteredGames();
      if (messageSlideEnabled()) return games.concat(messageSlideItem());
      return games;
    }

    function resolveIndex(items) {
      if (!items.length) return -1;
      if (state.currentGameId) {
        const i = items.findIndex((it) => rotateItemId(it) === String(state.currentGameId));
        if (i >= 0) return i;
      }
      return 0;
    }

    function updateRotateChrome(games, index) {
      if (!games.length) {
        rotPos.textContent = "0 of 0";
        return;
      }
      rotPos.textContent = (index + 1) + " of " + games.length;
    }

    function restartProgress() {
      progressBar.classList.remove("run");
      void progressBar.offsetWidth;
      if (state.view === "rotate" && rotateItems().length) {
        document.documentElement.style.setProperty("--dwell", state.dwellMs / 1000 + "s");
        progressBar.classList.add("run");
      }
    }

    function stopRotate() {
      if (state.rotateTimer) {
        clearTimeout(state.rotateTimer);
        state.rotateTimer = null;
      }
    }

    function scheduleRotate() {
      stopRotate();
      if (state.alertActive) return;
      if (state.view !== "rotate" || state.paused) {
        if (state.paused) return;
        progressBar.classList.remove("run");
        return;
      }
      const items = rotateItems();
      if (!items.length) {
        progressBar.classList.remove("run");
        return;
      }
      restartProgress();
      state.rotateTimer = setTimeout(() => stepRotate(1), state.dwellMs);
    }

    function paintSpotlight(event, animDir) {
      const existing = stageEl.querySelector(".spot");
      const same = existing && existing.getAttribute("data-id") === gameId(event);
      if (same && !animDir) {
        const tmp = document.createElement("div");
        tmp.innerHTML = spotlightHtml(event);
        const next = tmp.firstElementChild;
        const oldImgs = [...existing.querySelectorAll("img")];
        next.querySelectorAll("img").forEach((img) => {
          const old = oldImgs.find((o) => o.getAttribute("src") === img.getAttribute("src"));
          if (old) img.replaceWith(old);
        });
        existing.replaceWith(next);
        paintLedTreeAfterLayout(stageEl);
        return;
      }
      stageEl.classList.remove("anim-next", "anim-prev");
      if (animDir === 1) stageEl.classList.add("anim-next");
      if (animDir === -1) stageEl.classList.add("anim-prev");
      stageEl.innerHTML = spotlightHtml(event);
      paintLedTreeAfterLayout(stageEl);
      if (animDir) {
        const onEnd = () => {
          stageEl.classList.remove("anim-next", "anim-prev");
          stageEl.querySelectorAll(".spot").forEach((el) => { el.style.transform = "none"; });
          paintLedTreeAfterLayout(stageEl);
        };
        stageEl.querySelector(".spot")?.addEventListener("animationend", onEnd, { once: true });
      }
    }

    function ledWrapLines(text, maxChars) {
      maxChars = Math.max(1, maxChars | 0);
      const raw = String(text || "").replace(/\r\n/g, "\n").replace(/\t/g, " ");
      const out = [];
      raw.split("\n").forEach((para) => {
        if (para === "") { out.push(""); return; }
        const words = para.split(/ +/);
        let cur = "";
        const flush = () => { if (cur !== "") { out.push(cur); cur = ""; } };
        words.forEach((w) => {
          if (w.length > maxChars) {
            flush();
            for (let k = 0; k < w.length; k += maxChars) out.push(w.slice(k, k + maxChars));
            return;
          }
          const next = cur ? cur + " " + w : w;
          if (next.length > maxChars) { flush(); cur = w; }
          else cur = next;
        });
        flush();
      });
      return out.length ? out : [""];
    }

    function fitMessageText(text, cssW, cssH, dpr) {
      const maxDevW = Math.max(1, Math.round(cssW * dpr));
      const maxDevH = Math.max(1, Math.round(cssH * dpr));
      const minP = LED_MIN_PITCH;
      const preferred = Math.max(minP, fitLedPitch(Math.max(8, cssH * 0.42), dpr, LED_ROWS));
      const longestWord = Math.max(1, ...String(text).split(/\s+/).map((w) => w.length));
      const attempt = (p, maxChars) => {
        const mc = maxChars || Math.max(1, Math.floor(maxDevW / (LED_ADV * p)));
        const lines = ledWrapLines(text, mc);
        const rowSpan = lines.length * LED_ROWS + Math.max(0, lines.length - 1);
        const usedH = rowSpan * p;
        const maxLineW = Math.max(0, ...lines.map((ln) => measureLedText(ln, p).w));
        const hardBreaks = !maxChars && longestWord > mc;
        return { lines: lines, pitch: p, rowSpan: rowSpan, usedH: usedH, maxLineW: maxLineW, fitsH: usedH <= maxDevH, fitsW: maxLineW <= maxDevW, hardBreaks: hardBreaks };
      };
      let pitch = preferred;
      let best = attempt(pitch);
      while (pitch > minP && (!best.fitsH || !best.fitsW || best.hardBreaks)) {
        pitch -= 1;
        best = attempt(pitch);
      }
      if (best.fitsH && best.fitsW) {
        return { lines: best.lines, pitch: best.pitch, rowSpan: best.rowSpan, contentW: best.maxLineW, gap: 0, scroll: false };
      }
      const p = Math.max(minP, Math.min(preferred, Math.floor(maxDevH / LED_ROWS)));
      const maxLines = Math.max(1, Math.floor((maxDevH + p) / ((LED_ROWS + 1) * p)));
      const joined = String(text).replace(/\s+/g, " ").trim();
      const mc = Math.max(8, Math.ceil((joined.length || 1) / maxLines));
      best = attempt(p, mc);
      if (best.lines.length > maxLines) best = attempt(p, Math.max(mc, Math.ceil(((joined.length || 1) + maxLines) / maxLines)));
      const gap = Math.max(Math.round(24 * p), Math.round(maxDevW * 0.35));
      return { lines: best.lines, pitch: best.pitch, rowSpan: best.rowSpan, contentW: best.maxLineW, gap: gap, scroll: true };
    }

    const msgAnim = { raf: 0, x: 0, last: 0, layout: null, cv: null, patKey: "", pat: null };

    function stopMessageScroll() {
      if (msgAnim.raf) cancelAnimationFrame(msgAnim.raf);
      msgAnim.raf = 0;
      msgAnim.cv = null;
      msgAnim.last = 0;
    }

    function ledUnlitPattern(pitch, color) {
      const key = pitch + ":" + color;
      if (msgAnim.pat && msgAnim.patKey === key) return msgAnim.pat;
      const tile = document.createElement("canvas");
      tile.width = Math.max(1, pitch);
      tile.height = Math.max(1, pitch);
      const tctx = tile.getContext("2d");
      drawLedDot(tctx, pitch / 2, pitch / 2, pitch, color);
      msgAnim.pat = tctx.createPattern(tile, "repeat");
      msgAnim.patKey = key;
      return msgAnim.pat;
    }

    function paintMessageFrame(cv, layout, offsetX) {
      const dpr = ledDpr();
      const cssW = cv.clientWidth || (cv.parentElement && cv.parentElement.clientWidth) || 300;
      const cssH = cv.clientHeight || (cv.parentElement && cv.parentElement.clientHeight) || 200;
      const sized = sizeLedCanvas(cv, cssW, cssH, dpr, false);
      const w = sized.w, h = sized.h;
      const ctx = cv.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const bg = state.message.bg;
      const fg = state.message.fg;
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);
      const pitch = layout.pitch;
      const unlit = mixHex(bg, fg, 0.16);
      ctx.fillStyle = ledUnlitPattern(pitch, unlit);
      ctx.fillRect(0, 0, w, h);
      const usedH = layout.rowSpan * pitch;
      let y = Math.round((h - usedH) / 2 / pitch) * pitch;
      const drawBlock = (ox) => {
        let yy = y;
        for (const ln of layout.lines) {
          const lineW = measureLedText(ln, pitch).w;
          const x = layout.scroll ? ox : Math.round(Math.max(0, (w - lineW) / 2) / pitch) * pitch;
          drawLedText(ctx, ln, x, yy, pitch, fg);
          yy += (LED_ROWS + 1) * pitch;
        }
      };
      if (layout.scroll) {
        const x0 = Math.round(-offsetX);
        drawBlock(x0);
        drawBlock(x0 + layout.contentW + layout.gap);
      } else {
        drawBlock(0);
      }
    }

    function startMessageScroll(cv, layout) {
      stopMessageScroll();
      msgAnim.cv = cv;
      msgAnim.layout = layout;
      msgAnim.x = 0;
      msgAnim.last = 0;
      if (!layout.scroll) {
        paintMessageFrame(cv, layout, 0);
        return;
      }
      const loop = (ts) => {
        if (!msgAnim.cv || !msgAnim.cv.isConnected) { stopMessageScroll(); return; }
        if (!msgAnim.last) msgAnim.last = ts;
        const dt = Math.min(0.05, (ts - msgAnim.last) / 1000);
        msgAnim.last = ts;
        const speed = layout.pitch * 8;
        const total = layout.contentW + layout.gap;
        if (total > 0) msgAnim.x = (msgAnim.x + speed * dt) % total;
        paintMessageFrame(msgAnim.cv, layout, msgAnim.x);
        msgAnim.raf = requestAnimationFrame(loop);
      };
      paintMessageFrame(cv, layout, 0);
      msgAnim.raf = requestAnimationFrame(loop);
    }

    function layoutAndPaintMessage(root) {
      const cv = root.querySelector ? root.querySelector(".msg-led-cv") : null;
      if (!cv) return;
      const text = String(state.message.text || "").trim();
      if (!text) return;
      const cssW = cv.clientWidth || root.clientWidth || 300;
      const cssH = cv.clientHeight || root.clientHeight || 200;
      if (cssW < 8 || cssH < 8) return;
      const layout = fitMessageText(text, cssW, cssH, ledDpr());
      startMessageScroll(cv, layout);
    }

    function messageScreenHtml() {
      const text = String(state.message.text || "").trim();
      return '<article class="msg-screen" data-id="' + MESSAGE_SLIDE_ID + '" style="--msg-bg:' + escapeHtml(state.message.bg) + ';background:' + escapeHtml(state.message.bg) + '">' +
        '<canvas class="msg-led-cv" aria-hidden="true"></canvas>' +
        '<span class="vh">' + escapeHtml(text) + "</span></article>";
    }

    function paintMessageSlide(animDir) {
      const existing = stageEl.querySelector(".msg-screen");
      if (existing && !animDir) {
        layoutAndPaintMessage(existing);
        return;
      }
      stopMessageScroll();
      stageEl.classList.remove("anim-next", "anim-prev");
      if (animDir === 1) stageEl.classList.add("anim-next");
      if (animDir === -1) stageEl.classList.add("anim-prev");
      stageEl.innerHTML = messageScreenHtml();
      paintLedTreeAfterLayout(stageEl);
      if (animDir) {
        const onEnd = () => {
          stageEl.classList.remove("anim-next", "anim-prev");
          const el = stageEl.querySelector(".msg-screen");
          if (el) { el.style.transform = "none"; layoutAndPaintMessage(el); }
        };
        const node = stageEl.querySelector(".msg-screen");
        if (node) node.addEventListener("animationend", onEnd, { once: true });
      }
    }

    function noGamesBoardHtml() {
      const ids = state.filter && state.filter !== "all" ? [state.filter] : enabledSportIds();
      const lines = (ids.length ? ids : SPORT_ORDER).map((id) => {
        const cfg = SPORTS[id];
        if (!cfg) return null;
        const err = state.sportErrors[id];
        if (err) return { t: cfg.tag + "  ERROR", c: "#ff2a2a" };
        return { t: cfg.tag + "  NO GAMES", c: "#ffb000" };
      }).filter(Boolean);
      if (!lines.length) lines.push({ t: "NO GAMES", c: "#ffb000" });
      const hint = enabledSportIds().length ? "Nothing matched your filters right now." : "Open Settings to choose sports.";
      return '<div class="msg no-games-led" style="margin:auto;width:min(96%,720px);text-align:center">' +
        lines.map((ln, i) => '<div class="led-status-slot" style="height:56px;width:100%;position:relative;margin:8px 0">' +
          ledCanvas("led-text-cv", { "data-text": ln.t, "data-color": ln.c, "data-led-align": "center" }, "led-text-cv led-fill") +
        "</div>").join("") +
        "<p>" + escapeHtml(hint) + "</p></div>";
    }

    function showResolvedSpotlight(animDir) {
      const items = rotateItems();
      if (!items.length) {
        stopMessageScroll();
        state.currentGameId = null;
        stageEl.classList.remove("anim-next", "anim-prev");
        stageEl.innerHTML =
          noGamesBoardHtml();
        paintLedTreeAfterLayout(stageEl);
        updateRotateChrome(items, -1);
        progressBar.classList.remove("run");
        stopRotate();
        return;
      }
      const index = resolveIndex(items);
      state.currentGameId = rotateItemId(items[index]);
      if (isMessageSlide(items[index])) {
        const currentEl = stageEl.querySelector(".msg-screen");
        const same = currentEl && currentEl.getAttribute("data-id") === MESSAGE_SLIDE_ID;
        paintMessageSlide(same ? 0 : animDir);
      } else {
        stopMessageScroll();
        const currentEl = stageEl.querySelector(".spot");
        const sameGame = currentEl && currentEl.getAttribute("data-id") === state.currentGameId;
        paintSpotlight(items[index], sameGame ? 0 : animDir);
      }
      updateRotateChrome(items, index);
    }

    function stepRotate(dir) {
      if (state.alertActive) return;
      const items = rotateItems();
      if (!items.length) return;
      let i = resolveIndex(items);
      i = (i + dir + items.length) % items.length;
      state.currentGameId = rotateItemId(items[i]);
      if (isMessageSlide(items[i])) paintMessageSlide(dir);
      else { stopMessageScroll(); paintSpotlight(items[i], dir); }
      updateRotateChrome(items, i);
      if (!state.paused) scheduleRotate();
      else {
        stopRotate();
        progressBar.classList.remove("run");
      }
    }

    function renderGrid() {
      const games = filteredGames();
      if (state.error && !state.events.length) {
        gridView.innerHTML =
          '<div class="msg error"><h2>Couldn’t load scores</h2><p>' +
          escapeHtml(state.error) +
          '</p><button type="button" id="retry-btn">Try again</button></div>';
        document.getElementById("retry-btn")?.addEventListener("click", () => load(true));
        return;
      }
      if (!games.length) {
        gridView.innerHTML =
          noGamesBoardHtml();
        paintLedTreeAfterLayout(gridView);
        return;
      }
      const groups = { live: [], final: [], upcoming: [] };
      for (const ev of games) groups[statusBucket(ev)].push(ev);
      const titles = { live: "Live", final: "Final", upcoming: "Upcoming" };
      let html = "";
      for (const key of ["live", "final", "upcoming"]) {
        const list = groups[key];
        if (!list.length) continue;
        html +=
          '<section class="status-section">' +
          '<h2 class="status-head ' + key + '"><span class="dot"></span>' +
          titles[key] + " (" + list.length + ")</h2>" +
          '<div class="grid">' + list.map(cardHtml).join("") + "</div></section>";
      }
      gridView.innerHTML = html;
      paintLedTreeAfterLayout(gridView);
    }

    function applyViewMode() {
      const isRotate = state.view === "rotate";
      document.body.classList.toggle("view-rotate", isRotate);
      document.body.classList.toggle("view-grid", !isRotate);
      document.body.classList.toggle("is-paused", state.paused);
      rotateView.hidden = !isRotate;
      gridView.hidden = isRotate;
      document.getElementById("view-rotate").setAttribute("aria-pressed", isRotate ? "true" : "false");
      document.getElementById("view-grid").setAttribute("aria-pressed", isRotate ? "false" : "true");
    }

    function setView(view) {
      state.view = view;
      savePrefs();
      applyViewMode();
      if (view === "rotate") {
        showResolvedSpotlight(0);
        if (!state.paused) scheduleRotate();
      } else {
        stopRotate();
        progressBar.classList.remove("run");
        renderGrid();
      }
    }

    function setPaused(paused) {
      state.paused = paused;
      document.body.classList.toggle("is-paused", paused);
      rotPlay.setAttribute("aria-label", paused ? "Play rotation" : "Pause rotation");
      rotPlay.setAttribute("aria-pressed", paused ? "true" : "false");
      iconPause.hidden = paused;
      iconPlay.hidden = !paused;
      if (state.alertActive) return;
      if (paused) stopRotate();
      else scheduleRotate();
    }

    function updateTimestamp() {
      if (!state.lastUpdated) {
        updatedEl.textContent = "";
        return;
      }
      updatedEl.innerHTML =
        "Updated " + formatNow(state.lastUpdated) +
        ' <span class="hint">· Auto-refresh 10s</span>';
    }

    function scheduleRefresh() {
      if (state.refreshTimer) clearInterval(state.refreshTimer);
      state.refreshTimer = setInterval(() => load(false), REFRESH_MS);
    }


    function updateTicker() {
      const games = (typeof filteredGames === "function") ? filteredGames() : [];
      const runs = [];
      if (!games.length) runs.push({ t: "  NO GAMES  ", c: "#ffb000" });

      try {
        const data = await fetchScoreboard();
        const incoming = data.events || [];
        const alerts = state.alertsOn
          ? detectScoreAlerts(state.scoreSnap, incoming, state.filter)
          : [];
        state.events = incoming;
        state.scoreSnap = snapshotScores(incoming);
        const wasSkip = state.skipAlerts;
        state.skipAlerts = false;
        populateCalendar(data);
        renderSportTabs();

        if (data._errors && data._errors.length && !incoming.length) {
          throw new Error(data._errors.join(" · "));
        }
        boardEl.setAttribute("aria-busy", "false");
        if (!wasSkip && alerts.length) enqueueAlerts(alerts);

    let swipeX = null, swipeY = null, swipeT = 0, swipeMoved = false, swipePointer = null;
    const swipeIgnore = "a, button, input, select, textarea, label, .topbar, .rotate-bar, .rot-progress, .settings-overlay";
    function pointerOnChrome(target) {
      return !!(target && target.closest && target.closest(swipeIgnore));
    }
    document.addEventListener("pointerdown", (e) => {
      if (e.button != null && e.button !== 0) return;
      swipeX = e.clientX;
      swipeY = e.clientY;
      swipeT = Date.now();
      swipeMoved = false;
      swipePointer = e.pointerId;
    }, { passive: true });
    document.addEventListener("pointermove", (e) => {
      if (swipeX == null) return;
      if (Math.abs(e.clientX - swipeX) > 12 || Math.abs(e.clientY - swipeY) > 12) swipeMoved = true;
    }, { passive: true });
    document.addEventListener("pointerup", (e) => {
      if (swipeX == null) return;
      if (swipePointer != null && e.pointerId !== swipePointer) return;
      const dx = e.clientX - swipeX;
      const dy = e.clientY - swipeY;
      const dt = Date.now() - swipeT;
      const onChrome = pointerOnChrome(e.target);
      swipeX = null;
      swipeY = null;
      swipePointer = null;
      if (state.alertActive) return;
      if (Math.abs(dx) >= 50 && Math.abs(dx) > Math.abs(dy) * 1.25 && state.view === "rotate") {
        stepRotate(dx < 0 ? 1 : -1);
        return;
      }
      if (!swipeMoved && !onChrome && dt < 600) toggleControls();
    }, { passive: true });
    document.addEventListener("pointercancel", () => {
      swipeX = null;
      swipeY = null;
      swipePointer = null;
    }, { passive: true });

    function loadCatalogCache() {
      try {

    function parseStandingsCatalog(data) {
      const conferences = [];
      const teams = [];
      const seen = new Set();
      (data.children || []).forEach((conf) => {
        const cid = String(conf.id || "");
        if (!cid) return;
        conferences.push({
          id: cid,
          name: conf.name || conf.shortName || cid,
          short: conf.shortName || conf.abbreviation || conf.name || cid,
          abbr: (conf.abbreviation || conf.shortName || "").toUpperCase()
        });
        let entries = [];
        const st = conf.standings;
        if (st && Array.isArray(st)) st.forEach((s) => { entries = entries.concat(s.entries || []); });
        else if (st && st.entries) entries = st.entries;
        entries.forEach((en) => {
          const tm = en.team || {};
          const tid = String(tm.id || "");
          if (!tid || seen.has(tid)) return;
          seen.add(tid);
          const logos = tm.logos || [];
          const dark = logos.find((l) => /dark/.test((l.rel || []).join(" "))) || logos[0];
          teams.push({
            id: tid,
            name: tm.displayName || tm.shortDisplayName || tm.name || tid,
            abbrev: (tm.abbreviation || "").toUpperCase(),
            logo: (dark && dark.href) || "",
            conferenceId: cid
          });
        });
      });
      conferences.sort((a, b) => a.name.localeCompare(b.name));
      teams.sort((a, b) => a.name.localeCompare(b.name));
      return { conferences: conferences, teams: teams };
    }

    function parseTeamsCatalog(data, sport) {
      const sports = data.sports || [];
      const teams = [];
      sports.forEach((s) => (s.leagues || []).forEach((lg) => (lg.teams || []).forEach((item) => {
        const tm = item.team || item;
        const tid = String(tm.id || "");
        if (!tid) return;
        const logos = tm.logos || [];
        const dark = logos.find((l) => /dark/.test((Array.isArray(l.rel) ? l.rel.join(" ") : "") + " " + (l.href || ""))) || logos[0];
        teams.push({
          id: tid,
          name: tm.displayName || tm.shortDisplayName || tm.name || tid,
          abbrev: (tm.abbreviation || "").toUpperCase(),
          logo: (dark && dark.href) || tm.logo || ""
        });
      })));
      teams.sort((a, b) => a.name.localeCompare(b.name));
      // attach known divisions
      const divs = divisionsFor(sport);
      teams.forEach((tm) => {
        const d = divs.find((x) => x.abbrs.includes(tm.abbrev));
        if (d) { tm.divisionId = d.id; tm.league = d.league; d.teamIds = d.teamIds || []; if (!d.teamIds.includes(tm.id)) d.teamIds.push(tm.id); }
      });
      return { teams: teams };
    }

    async function ensureCatalog(id) {
      const cfg = SPORTS[id];
      const cat = state.catalog[id] || (state.catalog[id] = {});
      if (cfg.hasTop25 && cat.conferences && cat.conferences.length) return cat;
      if (cfg.hasDivisions && cat.teams && cat.teams.length) return cat;
      try {
        if (cfg.standings) {
          const data = await fetchJson(cfg.standings);
          const parsed = parseStandingsCatalog(data);
          state.catalog[id] = parsed;
        } else if (cfg.teams) {
          const data = await fetchJson(cfg.teams);
          state.catalog[id] = parseTeamsCatalog(data, id);
        }
        saveCatalogCache();
      } catch (err) {
        console.warn("catalog", id, err);
      }
      return state.catalog[id];
    }

          const cid = String(inp.getAttribute("data-conf"));
          const arr = state.sports[id].conferences;
          const i = arr.indexOf(cid);
          if (inp.checked && i < 0) arr.push(cid);
          if (!inp.checked && i >= 0) arr.splice(i, 1);
          inp.closest(".chip").classList.toggle("is-on", inp.checked);
          persistAndRefresh();
        });
      });
      settingsBody.querySelectorAll("[data-div]").forEach((inp) => {
        inp.addEventListener("change", () => {
          const id = inp.getAttribute("data-sport");
          const did = inp.getAttribute("data-div");
          const arr = state.sports[id].divisions;
          const i = arr.indexOf(did);
          if (inp.checked && i < 0) arr.push(did);
          if (!inp.checked && i >= 0) arr.splice(i, 1);
          inp.closest(".chip").classList.toggle("is-on", inp.checked);
          persistAndRefresh();
        });
      });
      settingsBody.querySelectorAll("[data-league]").forEach((inp) => {
        inp.addEventListener("change", () => {
          const id = inp.getAttribute("data-sport");
          const lg = inp.getAttribute("data-league");
          const arr = state.sports[id].leagues;
          const i = arr.indexOf(lg);
          if (inp.checked && i < 0) arr.push(lg);
          if (!inp.checked && i >= 0) arr.splice(i, 1);
          persistAndRefresh();
        });
      });
      settingsBody.querySelectorAll("[data-unfav]").forEach((btn) => {
        btn.addEventListener("click", () => removeFavorite(btn.getAttribute("data-sport"), btn.getAttribute("data-unfav")));
      });
      settingsBody.querySelectorAll("[data-fav-search]").forEach((inp) => {
        inp.addEventListener("input", () => renderFavResults(inp.getAttribute("data-fav-search"), inp.value));
        inp.addEventListener("focus", () => renderFavResults(inp.getAttribute("data-fav-search"), inp.value));
      });
      document.addEventListener("click", hideFavOnOutside, true);
    }

    function hideFavOnOutside(e) {
      if (!settingsOpen()) return;
      if (e.target.closest("[data-fav-search], [data-fav-results], [data-unfav]")) return;
      settingsBody.querySelectorAll("[data-fav-results]").forEach((el) => { el.hidden = true; });
    }

    function renderFavResults(sport, q) {
      const box = settingsBody.querySelector('[data-fav-results="' + sport + '"]');
      if (!box) return;
      const query = String(q || "").trim().toLowerCase();
      const favIds = new Set((state.sports[sport].favorites || []).map((f) => String(f.id)));
      let teams = (state.catalog[sport] && state.catalog[sport].teams) || [];
      if (query) {
        teams = teams.filter((tm) => (tm.name + " " + tm.abbrev + " " + tm.id).toLowerCase().includes(query));
      }
      teams = teams.filter((tm) => !favIds.has(String(tm.id))).slice(0, 40);
      if (!teams.length) {
        box.hidden = !query;
        box.innerHTML = query ? "<li>No matches</li>" : "";
        return;
      }
      box.hidden = false;
      box.innerHTML = teams.map((tm) => {
        return '<li tabindex="0" data-sport="' + sport + '" data-add-fav="' + escapeHtml(String(tm.id)) + '">' +
          (tm.logo ? '<img src="' + escapeHtml(tm.logo) + '" alt="">' : "") +
          escapeHtml((tm.abbrev ? tm.abbrev + " · " : "") + tm.name) + "</li>";
      }).join("");
      box.querySelectorAll("[data-add-fav]").forEach((li) => {
        const add = () => addFavorite(sport, li.getAttribute("data-add-fav"));
        li.addEventListener("click", add);
        li.addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
      });
    }

    function addFavorite(sport, teamId) {
      const tm = ((state.catalog[sport] && state.catalog[sport].teams) || []).find((x) => String(x.id) === String(teamId));
      if (!tm) return;
      const favs = state.sports[sport].favorites;
      if (favs.some((f) => String(f.id) === String(tm.id))) return;
      favs.push({ id: String(tm.id), name: tm.name, abbrev: tm.abbrev, logo: tm.logo || "" });
      const hold = settingsBody.querySelector('[data-fav-selected="' + sport + '"]');
      if (hold) {
        hold.insertAdjacentHTML("beforeend", favChipHtml(sport, favs[favs.length - 1]));
        hold.querySelector("[data-unfav=\"" + CSS.escape(String(tm.id)) + "\"]")?.addEventListener("click", (e) => {
          removeFavorite(sport, e.currentTarget.getAttribute("data-unfav"));
        });
      }
      const inp = settingsBody.querySelector('[data-fav-search="' + sport + '"]');
      if (inp) inp.value = "";
      const box = settingsBody.querySelector('[data-fav-results="' + sport + '"]');
      if (box) box.hidden = true;
      persistAndRefresh();
    }

    function removeFavorite(sport, teamId) {
      state.sports[sport].favorites = (state.sports[sport].favorites || []).filter((f) => String(f.id) !== String(teamId));
      const chip = settingsBody.querySelector('[data-fav-selected="' + sport + '"] [data-fav-id="' + CSS.escape(String(teamId)) + '"]');
      if (chip) chip.remove();
      persistAndRefresh();
    }

    let persistTimer = null;
    function persistAndRefresh() {
      savePrefs();
      updateBrand();
      renderSportTabs();
      document.body.classList.toggle("week-hidden", !enabledSportIds().includes("cfb"));
      if (persistTimer) clearTimeout(persistTimer);
      persistTimer = setTimeout(() => {
        state.currentGameId = null;
        state.skipAlerts = true;
        state.scoreSnap = null;
        load(false);
      }, 350);
    }

    async function openSettings() {
      settingsOverlay.hidden = false;
      document.body.classList.add("settings-open");
      renderSettings();
      settingsClose.focus();
      const needed = SPORT_ORDER.filter((id) => {
        const cfg = SPORTS[id];
        const cat = state.catalog[id] || {};
        return (cfg.hasTop25 && !(cat.conferences && cat.conferences.length)) || (cfg.hasDivisions && !(cat.teams && cat.teams.length));
      });
      if (needed.length) {
        await Promise.all(needed.map((id) => ensureCatalog(id)));
        if (settingsOpen()) renderSettings();
      }
    }
    function closeSettings() {
      settingsOverlay.hidden = true;
      document.body.classList.remove("settings-open");
      if (settingsBtn) settingsBtn.focus();
    }

    settingsBtn.addEventListener("click", () => { if (settingsOpen()) closeSettings(); else openSettings(); });
    settingsClose.addEventListener("click", closeSettings);
    settingsOverlay.addEventListener("click", (e) => { if (e.target === settingsOverlay) closeSettings(); });

    loadCatalogCache();
    renderSportTabs();
    updateBrand();
    document.body.classList.toggle("week-hidden", !enabledSportIds().includes("cfb"));
    enabledSportIds().forEach((id) => { ensureCatalog(id); });

    applyViewMode();
    setPaused(false);
    load(true).then(() => {
      if (demoMode) window.setTimeout(() => window.__cfbDemo.simulateBoth(), 800);
    });
  </script>
</body>
</html>
