<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Race Ticker</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --muted:#8b949e;
    --red:#e5484d; --green:#3fb950; --gold:#f5c542; --blue:#58a6ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif}
  body{display:grid;grid-template-rows:auto 1fr auto;gap:1.2vh;padding:1.5vh 1.5vw}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:1.2vh;box-shadow:0 .6vh 2vh rgba(0,0,0,.35);overflow:hidden;position:relative}

  /* Top bar */
  #top{display:flex;align-items:center;justify-content:space-between;padding:1.6vh 2.5vw;font-size:4.6vh;font-weight:700}
  #top .race{color:var(--text)} #top .race span{color:var(--red)}
  #top .live{display:flex;align-items:center;gap:.8vw;font-size:2.6vh;font-weight:700;color:var(--red);letter-spacing:.2em}
  #top .live i{width:1.6vh;height:1.6vh;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite}
  #top .start{font-weight:600;color:var(--muted)} #top .start b{color:var(--text)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.7)}70%{box-shadow:0 0 0 1.4vh rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}

  /* Middle grid: 2 columns x 5 rows, cards slide to their new spot when positions change */
  #middle{padding:1.6vh 1.2vw}
  #grid{position:relative;width:100%;height:100%}
  .item{position:absolute;width:calc(50% - .8vw);height:calc(20% - 1.2vh);display:flex;align-items:center;gap:1.4vw;
    padding:0 1.6vw;background:#1c2129;border:1px solid var(--line);border-radius:1.2vh;
    font-size:min(5.2vh,2.4vw);font-weight:700;transition:top .7s ease,left .7s ease,background .4s}
  .item.p1{background:#2a2610;border-color:#6b5a1a}
  .pos{display:inline-flex;align-items:center;justify-content:center;min-width:9vh;height:9vh;border-radius:1.2vh;
    background:#2d333b;color:var(--muted);font-size:5.6vh;flex:none}
  .item.p1 .pos{background:var(--gold);color:#1a1300}
  .item.p2 .pos{background:#c0c6cf;color:#111} .item.p3 .pos{background:#c98a4b;color:#1a0d00}
  .num{color:var(--blue);font-variant-numeric:tabular-nums;min-width:2.5em;flex:none}
  .name{color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .item.p1 .name{color:var(--gold)}
  .gap{font-size:min(2.8vh,1.3vw);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}

  /* Slot car zoom */
  #car{position:absolute;top:50%;left:0;height:30vh;transform:translate(110vw,-50%);z-index:3;pointer-events:none;
    filter:drop-shadow(0 1vh 1.2vh rgba(0,0,0,.6))}
  #car.go{animation:zoom .7s cubic-bezier(.3,0,.7,1) forwards}
  @keyframes zoom{from{transform:translate(110vw,-50%)}to{transform:translate(-90vh,-50%)}}

  /* Bottom: current leader */
  #bottom{display:flex;align-items:center;justify-content:center;gap:2vw;padding:1.8vh 2vw;font-size:5vh;font-weight:700}
  #bottom .tag{font-size:2.6vh;letter-spacing:.2em;color:var(--muted)}
  #bottom .p{background:var(--gold);color:#1a1300;border-radius:1vh;padding:.3vh 1.2vw}
  #bottom .who .n{color:var(--blue)}
  #bottom.flash{animation:flash .9s}
  @keyframes flash{0%,40%,80%{background:#2d2a12}20%,60%,100%{background:var(--panel)}}

  /* Winner */
  #winner{position:fixed;inset:0;display:none;z-index:10;padding:5vh;
    background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/8vh 8vh;animation:wave 1s linear infinite}
  #winner.show{display:block}
  @keyframes wave{to{background-position:8vh 0}}
  #winner .inner{height:100%;border-radius:1.6vh;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh}
  #winner h1{font-size:20vh;font-weight:900;letter-spacing:.08em;color:var(--gold);text-shadow:0 0 4vh rgba(245,197,66,.35);animation:pop 1s ease-in-out infinite alternate}
  #winner .who{font-size:9vh;font-weight:700} #winner .who .n{color:var(--blue);margin-right:2vw}
  @keyframes pop{from{transform:scale(1)}to{transform:scale(1.06)}}
</style>
</head>
<body>
  <header id="top" class="card">
    <div class="race">RACE <span id="raceNo"></span></div>
    <div class="live"><i></i>LIVE</div>
    <div class="start">START <b id="startTime"></b></div>
  </header>

  <main id="middle" class="card">
    <div id="grid"></div>
    <svg id="car" viewBox="0 0 220 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7">
        <line x1="160" y1="22" x2="215" y2="22"/><line x1="172" y1="38" x2="220" y2="38"/><line x1="165" y1="54" x2="205" y2="54"/>
      </g>
      <path d="M8 52 Q10 40 30 36 L58 30 Q72 14 98 14 L118 14 Q132 16 140 30 L150 34 Q158 38 156 52 Z" fill="#e5484d"/>
      <path d="M66 31 Q78 19 98 19 L112 19 Q122 20 128 31 Z" fill="#9bd4ff"/>
      <rect x="10" y="42" width="144" height="5" fill="#f5c542"/>
      <circle cx="40" cy="56" r="12" fill="#222"/><circle cx="40" cy="56" r="5" fill="#bbb"/>
      <circle cx="126" cy="56" r="12" fill="#222"/><circle cx="126" cy="56" r="5" fill="#bbb"/>
      <text x="88" y="40" font-family="Arial" font-weight="900" font-size="12" fill="#fff" text-anchor="middle">12</text>
    </svg>
  </main>

  <footer id="bottom" class="card">
    <span class="tag">RACE LEADER</span><span class="p">P1</span><span class="who" id="leader"></span>
  </footer>

  <div id="winner"><div class="inner"><h1>WINNER</h1><div class="who" id="winWho"></div></div></div>

<script>
// ===== MOCK DATA (swap in live data later) =====
const race = { number: 7, start: "7:30 PM" };
const ROSTER = [
  { car: 12, name: "Jay Langa" },     { car: 7,  name: "Maria Delgado" },
  { car: 44, name: "Ryan Chen" },     { car: 3,  name: "Tom Walker" },
  { car: 88, name: "Sanjay Patel" },  { car: 21, name: "Kevin O'Brien" },
  { car: 55, name: "Dai Nakamura" },  { car: 9,  name: "Luis Morales" },
  { car: 31, name: "Bob Huffman" },   { car: 66, name: "Anna Kowalski" },
];

// ===== Timing =====
const RACE_MS = 60000, WINNER_MS = 10000;   // 1 minute race, 10 second winner screen
const CAR_EVERY_MS = 20000;                 // slot car zooms across every 20 seconds

let racers = [], cycleStart = performance.now(), winnerShown = false, lastLeader = null;
const $ = id => document.getElementById(id);
$("raceNo").textContent = race.number; $("startTime").textContent = race.start;

function resetRace(){ racers = ROSTER.map((r,i)=>({ ...r, laps: 42 - Math.floor(i*0.8), dist: Math.random() })); renderRacers(); }
function standings(){ return [...racers].sort((a,b)=>(b.laps+b.dist)-(a.laps+a.dist)); }

const cards = {};
const short = n => { const p = n.split(" "); return p.length > 1 ? p[0][0] + ". " + p.slice(1).join(" ") : n; };  // "Jay Langa" -> "J. Langa"
function renderRacers(){
  const s = standings(), lead = s[0].laps + s[0].dist;
  s.forEach((r,i)=>{
    let el = cards[r.car];
    if (!el){ el = cards[r.car] = document.createElement("div"); $("grid").appendChild(el); }
    const col = i < 5 ? 0 : 1, row = i % 5;
    el.style.left = col ? "calc(50% + .8vw)" : "0";
    el.style.top = `calc(${row*20}% + ${row*0.3}vh)`;
    el.className = "item" + (i<3 ? " p"+(i+1) : "");
    const g = lead - (r.laps + r.dist);
    const gap = i===0 ? "LEADER" : g >= 1 ? `-${Math.floor(g)} LAP${Math.floor(g)>1?"S":""}` : `+${(g*3.6).toFixed(2)}s`;
    el.innerHTML = `<span class="pos">${i+1}</span><span class="num">#${r.car}</span><span class="name">${short(r.name)}</span><span class="gap">${gap}</span>`;
  });
  const ld = s[0];
  if (ld.car !== lastLeader){
    lastLeader = ld.car;
    $("leader").innerHTML = `<span class="n">#${ld.car}</span> ${ld.name}`;
    const b = $("bottom"); b.classList.remove("flash"); void b.offsetWidth; b.classList.add("flash");
  }
}

// Race simulation
setInterval(()=>{ if (winnerShown) return;
  racers.forEach(r=>{ r.dist += 0.25+Math.random()*0.12; if(r.dist>=1){ r.dist-=1; r.laps++; } });
  renderRacers(); }, 1500);

// Crawl + car + winner loop
let lastCar = performance.now() - 17000, last = performance.now();
function launchCar(){ const c=$("car"); c.classList.remove("go"); void c.getBoundingClientRect(); c.classList.add("go"); }
function frame(now){
  const dt = (now - last)/1000; last = now;
  const el = now - cycleStart;

  if (el >= RACE_MS + WINNER_MS){            // loop the demo
    $("winner").classList.remove("show"); winnerShown = false;
    cycleStart = now; lastCar = now - 17000; lastLeader = null; resetRace();
  } else if (el >= RACE_MS && !winnerShown){  // race over: show winner
    winnerShown = true; const w = standings()[0];
    $("winWho").innerHTML = `<span class="n">#${w.car}</span>${w.name}`;
    $("winner").classList.add("show");
  }

  if (!winnerShown && now - lastCar > CAR_EVERY_MS){ lastCar = now; launchCar(); }
  requestAnimationFrame(frame);
}
resetRace(); requestAnimationFrame(frame);
</script>
</body>
</html>
